<style>

<style>
/* Layout: minimalista; cabecera clara con la semana en píldoras, calendario arriba, tarjetas planas con línea fina */
:root{
  --bg:#f4f6f5; --surface:#ffffff; --ink:#1c2321; --muted:#6a7571; --line:#e3e8e6;
  --blue:#0f7a68; --blue-2:#12907b; --sky:#e2f2ed; --gold:#d27a2c; --gold-soft:#fcefe2;
  --ok:#2f8a57; --ok-soft:#e5f4ea; --warn:#a8650c; --warn-soft:#fbefd9; --bad:#c2453b; --bad-soft:#fbe7e5; --vio:#6a4bc4; --vio-soft:#ece6fb; --pink:#b8407a; --pink-soft:#fde6f0;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101413; --surface:#181e1c; --ink:#e7ecea; --muted:#94a19c; --line:#27302d;
  --blue:#4fc7ad; --blue-2:#6fd6bf; --sky:#16302a; --gold:#f0a25a; --gold-soft:#36261a;
  --ok:#72d39a; --ok-soft:#15301f; --warn:#f2bb60; --warn-soft:#352a14; --bad:#ff8a7f; --bad-soft:#3b1a17; --vio:#b9a2ff; --vio-soft:#2a2145; --pink:#ff8fc0; --pink-soft:#3d1a2b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101413; --surface:#181e1c; --ink:#e7ecea; --muted:#94a19c; --line:#27302d;
  --blue:#4fc7ad; --blue-2:#6fd6bf; --sky:#16302a; --gold:#f0a25a; --gold-soft:#36261a;
  --ok:#72d39a; --ok-soft:#15301f; --warn:#f2bb60; --warn-soft:#352a14; --bad:#ff8a7f; --bad-soft:#3b1a17; --vio:#b9a2ff; --vio-soft:#2a2145; --pink:#ff8fc0; --pink-soft:#3d1a2b; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{background:var(--surface);border-bottom:1px solid var(--line);padding-block:18px 14px}
.brand{display:flex;align-items:center;gap:14px}
.pastor{position:relative;flex:none;width:64px;height:64px;border-radius:50%;padding:3px;background:conic-gradient(var(--blue),var(--gold),var(--blue));cursor:pointer;transition:transform .15s}

.pastor .staff{position:absolute;right:-6px;bottom:-4px;font-size:1.05rem;background:var(--surface);border-radius:50%;width:26px;height:26px;display:grid;place-items:center;box-shadow:0 0 0 1px var(--line)}
.verse{font-size:.8rem;color:var(--muted);font-style:italic;margin-top:2px}
.flock{display:flex;flex-direction:column;gap:8px;margin-top:14px;padding:12px 14px;border-radius:16px;background:var(--bg);border:1px solid var(--line)}

.list{display:flex;flex-direction:column;gap:8px}

.visit .t{font-variant-numeric:tabular-nums;font-weight:700;color:var(--blue);font-size:1rem}
.visit .t small{display:block;font-weight:500;color:var(--muted);font-size:.76rem}
.visit.done{border:2px solid var(--ok);background:var(--ok-soft)}.visit.done .name{text-decoration:underline;text-decoration-color:var(--ok);text-decoration-thickness:3px;text-underline-offset:5px}.visit.done .t{color:var(--ok)}
.visit.live{border-color:var(--gold)}
.visit.overflow .t{color:var(--bad)}
.body{min-width:0;display:flex;flex-direction:column;gap:7px}
.name{font-weight:700;font-size:1.03rem;overflow-wrap:anywhere}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{font-size:.74rem;padding:2px 8px;border-radius:999px;background:var(--bg);color:var(--muted);font-weight:600;border:1px solid var(--line)}
.tag.S{background:var(--sky);color:var(--blue);border-color:transparent}
.tag.nb{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.tag.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.tag.bad,.tag.Abierto{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.tag.En{background:var(--warn-soft);color:var(--warn);border-color:transparent}.tag.Resuelto{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.tel{font-size:.86rem;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tel a{color:var(--blue);font-weight:600;text-decoration:none;padding:3px 9px;border-radius:999px;background:var(--sky)}
.acts{display:flex;flex-wrap:wrap;gap:6px}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:8px 12px;font:inherit;font-size:.9rem;font-weight:600;cursor:pointer;transition:transform .15s,box-shadow .15s}
.btn.pri{background:var(--blue);color:var(--surface);border-color:var(--blue)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--surface)}

.btn:hover,.chip:hover{box-shadow:0 2px 8px rgba(0,0,0,.08)}
.btn:active,.chip:active,.day:active,.cd:active{transform:scale(.92)}
.btn:focus-visible,.chip:focus-visible,.day:focus-visible,.cd:focus-visible{outline:3px solid var(--blue-2);outline-offset:2px}
textarea{width:100%;min-height:60px;border:1px solid var(--line);border-radius:12px;padding:8px 10px;font:inherit;font-size:.92rem;background:var(--bg);color:var(--ink);resize:vertical}
.empty{color:var(--muted);text-align:center;padding:22px;border:1px dashed var(--line);border-radius:16px}
.lunch{color:var(--muted);font-size:.85rem;text-align:center;padding:2px}
details.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
details.panel summary{cursor:pointer;font-weight:700}
.wl{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.wlrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 0;border-top:1px solid var(--line)}
.wlrow .nm{flex:1;min-width:150px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
select{font:inherit;font-size:.86rem;padding:6px 8px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;font-size:.92rem;max-width:calc(100% - 32px);z-index:9}
.status{font-size:.8rem;color:var(--muted)}
.cal{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 12px;width:100%;max-width:400px;align-self:center}
.calhead{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.calhead h2{font-weight:700;font-size:.98rem;margin:0;flex:1;text-transform:capitalize}
.calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.calgrid .dn{font-size:.72rem;text-align:center;color:var(--muted);font-weight:700}
.cd{position:relative;height:38px;max-width:100%;border:1px solid transparent;border-radius:12px;background:transparent;color:var(--ink);font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:2px;min-width:0;transition:transform .15s,background .2s}
.cd:hover{background:var(--bg)}
.cd .num{font-size:.78rem;font-variant-numeric:tabular-nums}
.cd .mk{font-size:.72rem;line-height:1;min-height:1em}
.cd .mk.dot{font-size:.6rem;color:var(--blue);font-weight:700;background:var(--sky);border-radius:999px;padding:1px 5px;min-height:0}
.cd.out{visibility:hidden}
.cd.today{border-color:var(--gold)}
.cd.sel{background:var(--blue);color:var(--surface)}
.cd.full{background:var(--ok-soft)}.cd.full.sel{background:var(--blue)}
.cd .bell{position:absolute;top:1px;right:2px;font-size:.55rem}
.whorow{display:flex;gap:10px;align-items:center;min-width:0}
.min0{min-width:0;display:flex;flex-direction:column;gap:4px}
.av{position:relative;flex:none;width:var(--s,46px);height:var(--s,46px);border-radius:50%;overflow:hidden;display:grid;place-items:center;background:var(--sky);color:var(--blue);font-weight:700;font-size:calc(var(--s,46px)*.36);cursor:pointer;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line);transition:transform .15s}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.telbox{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:999px;padding:1px 8px;background:var(--surface)}
.telbox input{width:8.5em;border:0;background:transparent;color:var(--ink);font:inherit;font-variant-numeric:tabular-nums;padding:3px 0}
.telbox input::placeholder{color:var(--muted)}
.telbox .pen{font-size:.72rem;opacity:.7}
.telbox:focus-within{outline:2px solid var(--blue-2)}
.telbox input:focus{outline:none}
select.civil{font-size:.76rem;padding:2px 6px;border-radius:999px}
.agebox{display:inline-flex;align-items:center;gap:3px;font-size:.78rem;border:1px solid var(--line);border-radius:999px;padding:1px 4px 1px 7px;background:var(--surface)}
.agebox input{width:3.6em;border:0;background:transparent;color:var(--ink);font:inherit;font-weight:700;padding:2px 2px;text-align:center}
.agebox input:focus{outline:2px solid var(--blue-2);border-radius:6px}
.tag.A{background:var(--vio-soft);color:var(--vio);border-color:transparent}.tag.N{background:var(--pink-soft);color:var(--pink);border-color:transparent}
.av.A{background:var(--vio-soft);color:var(--vio)}.av.N{background:var(--pink-soft);color:var(--pink)}

label.av:active{transform:scale(.92)}
.av .cam{position:absolute;right:-1px;bottom:-1px;font-size:.62rem;background:var(--surface);border-radius:50%;width:18px;height:18px;display:grid;place-items:center;box-shadow:0 0 0 1px var(--line)}
.av.busy{opacity:.5}
.vh{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.offbox{display:flex;flex-direction:column;gap:8px;background:var(--bad-soft);border:1px solid var(--bad);border-radius:16px;padding:12px 14px}
.chip.off[aria-pressed="true"]{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.tag.conf{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.legend{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:8px;font-size:.7rem;justify-content:center;color:var(--muted)}
.case{border-top:1px solid var(--line);padding:10px 0;display:flex;flex-direction:column;gap:6px}
.case:first-of-type{border-top:0}
.casehead{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.casehead .name{font-size:.98rem;flex:1;min-width:140px}
.case .txt{white-space:pre-wrap;overflow-wrap:anywhere}
.notes{display:flex;flex-direction:column;gap:4px;padding-left:10px;border-left:2px solid var(--line)}

.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.row input[type=text]{flex:1;min-width:160px}
input[type=text],input[type=date]{font:inherit;font-size:.9rem;padding:7px 9px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.probform{display:flex;flex-direction:column;gap:6px;background:var(--bg);border-radius:12px;padding:10px}
.burst{position:fixed;pointer-events:none;z-index:20;font-size:1.6rem;animation:fly 1s ease-out forwards}
@keyframes fly{0%{transform:translate(-50%,-50%) scale(.6);opacity:1}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% - 90px)) scale(1.2);opacity:0}}
@keyframes sway{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
.em{display:inline-block;will-change:transform}
.em-door{transform-origin:15% 50%;animation:door 2.8s ease-in-out infinite}
@keyframes door{0%,55%,100%{transform:perspective(60px) rotateY(0)}18%,40%{transform:perspective(60px) rotateY(-60deg)}}

.em-play{animation:play 1.4s ease-in-out infinite}

.em-pop{animation:pop 2.2s ease-in-out infinite}
@keyframes pop{0%,70%,100%{transform:scale(1)}80%{transform:scale(1.3)}90%{transform:scale(.92)}}
.em-tick{animation:tick 1s steps(2) infinite}
@keyframes tick{0%{transform:rotate(-8deg)}100%{transform:rotate(8deg)}}
.em-write{transform-origin:20% 90%;animation:write 1.2s ease-in-out infinite}
@keyframes write{0%,100%{transform:translate(0,0) rotate(0)}25%{transform:translate(2px,-1px) rotate(-6deg)}50%{transform:translate(4px,0) rotate(4deg)}75%{transform:translate(2px,1px) rotate(-3deg)}}
.em-undo{animation:undo 2.4s ease-in-out infinite}
@keyframes undo{0%,60%,100%{transform:rotate(0)}30%{transform:rotate(-200deg)}}
.em-talk{transform-origin:20% 90%;animation:talk 1.6s ease-in-out infinite}
@keyframes talk{0%,100%{transform:scale(1)}30%{transform:scale(1.18) rotate(-4deg)}60%{transform:scale(.96)}}
.em-ring{transform-origin:50% 30%;animation:ring 2s ease-in-out infinite}
@keyframes ring{0%,40%,100%{transform:rotate(0)}5%,15%,25%{transform:rotate(-16deg)}10%,20%,30%{transform:rotate(16deg)}}
.em-buzz{animation:buzz 2.4s linear infinite}
@keyframes buzz{0%,70%,100%{transform:translateX(0)}74%,82%,90%{transform:translateX(-2px)}78%,86%,94%{transform:translateX(2px)}}
.em-blink{animation:blink 1.8s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
.em-rise{animation:rise 3s ease-in-out infinite}

.em-set{animation:set 3s ease-in-out infinite}

.em-hop{animation:hop 1.4s ease-in-out infinite}
.em-sway{transform-origin:50% 100%;animation:sway 2.6s ease-in-out infinite}
.em-beat{animation:beat 1.3s ease-in-out infinite}
@keyframes beat{0%,40%,100%{transform:scale(1)}15%{transform:scale(1.22)}30%{transform:scale(1.08)}}
.em-bow{transform-origin:50% 100%;animation:bow 2.6s ease-in-out infinite}

.em-no{animation:no 1.8s ease-in-out infinite}

.em-save{animation:save 1.8s ease-in-out infinite}

.em-spin{animation:spin 2.4s ease-in-out infinite}
@keyframes spin{0%,50%{transform:rotate(0)}80%,100%{transform:rotate(180deg)}}

<script>
const DOC = "agenda/semana";
const LS = "agenda-visitas-v1";
const DAYN = ["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"];
const DAYS = ["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"];
const WEEK = ["2026-10-19","2026-10-20","2026-10-21","2026-10-22","2026-10-23","2026-10-24","2026-10-25"];
const GROUP = {S:"🌾 Simpatizante",D:"🐑 Dama",C:"🐏 Caballero",J:"🙋 Joven",A:"🧑 Adolescente",N:"🧒 Niño",M:"👴 Anciano"};
function etapa(e){e=+e;return e<12?"🧒 Niño":e<18?"🧑 Adolescente":e<30?"🙋 Joven":e<60?"🧔 Adulto":"👴 Anciano"}
let lastPt = {x:innerWidth/2,y:innerHeight/2};
let npOpen = null, assets = null, upBusy = null;
let S = null, db = null, sel = 0, wlFilter = "all", calM = null, caseFilter = "open", probOpen = null, delAsk = null, toastT, saveT, saving = Promise.resolve();
const fired = {}; let audioCtx = null, wake = null;

const $ = (s, r=document) => r.querySelector(s);
const pad = n => String(n).padStart(2,"0");
function todayStr(){const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function nowMin(){const d=new Date();return d.getHours()*60+d.getMinutes()+d.getSeconds()/60}
function hm(m){m=Math.round(m);let h=Math.floor(m/60),mm=m%60;const ap=h>=12?"pm":"am";h=h%12||12;return h+":"+pad(mm)+" "+ap}
function dayLabel(f){const d=new Date(f+"T12:00");return {w:DAYN[d.getDay()],s:DAYS[d.getDay()],n:d.getDate()}}
const MESES=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const TIPOS=["Espiritual","Familiar","Salud","Económico","Trabajo","Otro"];
const TIPO_E={Espiritual:"🙏",Familiar:"👨‍👩‍👧",Salud:"🩺","Económico":"💰",Trabajo:"💼",Otro:"📌"};
const EST_E={"Abierto":"🔴","En seguimiento":"🟡","Resuelto":"🟢"};
const ESTADOS=["Abierto","En seguimiento","Resuelto"];
function fmtF(f){const d=new Date(f+"T12:00");return d.getDate()+" "+MESES[d.getMonth()].slice(0,3)}
function addDays(f,n){const d=new Date(f+"T12:00");d.setDate(d.getDate()+n);return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function weekOf(f){const d=new Date(f+"T12:00");const off=(d.getDay()+6)%7;const mon=addDays(f,-off);return [0,1,2,3,4,5,6].map(i=>addDays(mon,i))}
function ensureDay(f){let i=S.days.findIndex(d=>d.f===f);if(i>=0)return i;S.days.push({f,am:true,pm:true,ids:[]});S.days.sort((a,b)=>a.f<b.f?-1:1);return S.days.findIndex(d=>d.f===f)}
function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function toast(t){const el=$("#toast");el.textContent=t;try{animoji(el)}catch(e){}el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,2600)}

/* ---------- guardado ---------- */
const SHK=["id","n","g","det","nb","tel","edad","civil","foto","cargos","hitos","dir","sx","nac"];
/* ===== v4: grupos por edad, dirección, visitas, máximo por día ===== */
const APPV="4 · 15 oct 2026";
function fem(p){return p.sx==="F"||(!p.sx&&p.g==="D")}
function masc(p){return p.sx==="M"||(!p.sx&&p.g==="C")}
function gName(p){let l=GROUP[p.g]||"";if(fem(p)){if(p.g==="M")l=l.replace("Anciano","Anciana");if(p.g==="N")l=l.replace("Niño","Niña")}return l}
function gEnd(p){return fem(p)?"a":masc(p)?"o":"o/a"}
function edadDe(nac){const t=new Date(),d=new Date(nac+"T12:00");if(isNaN(d))return null;let e=t.getFullYear()-d.getFullYear();if(t.getMonth()<d.getMonth()||(t.getMonth()===d.getMonth()&&t.getDate()<d.getDate()))e--;return Math.max(0,e)}
function grupoPorEdad(p){
  if(p.g==="S"||p.edad==null||p.edad==="")return p.g;
  const e=+p.edad;
  if(e<12)return "N"; if(e<18)return "A"; if(e<30){if(["casado","union","viudo","separado"].includes(p.civil)&&(fem(p)||masc(p)))return fem(p)?"D":"C";return "J"} if(e>=60)return "M";
  if(fem(p))return "D"; if(masc(p))return "C"; return p.g;
}
function needSx(p){return p.g!=="S"&&p.edad!=null&&p.edad!==""&&+p.edad>=30&&+p.edad<60&&!fem(p)&&!masc(p)}
function applyGroup(q){
  if(!q.sx&&q.g==="D")q.sx="F"; if(!q.sx&&q.g==="C")q.sx="M";
  const ng=grupoPorEdad(q); if(ng===q.g)return false;
  q.g=ng;
  if(ng==="A"||ng==="N"){q.det="";q.nb=false}
  else if(q.det==="Simpatizante"){q.det="";q.nb=false}
  return true;
}
function ageSync(){let ch=false;for(const q of Object.values(S.people)){if(q.nac){const e=edadDe(q.nac);if(e!=null&&e!==q.edad){q.edad=e;ch=true}}if(q.edad!=null&&q.edad!==""&&applyGroup(q))ch=true}return ch}
function mapsUrl(d){return "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(d)}
function dirLine(p){return p.dir?`<div class="dirline"><span>📍 ${esc(p.dir)}</span><a href="${mapsUrl(p.dir)}" target="_blank" rel="noopener">Cómo llegar</a></div>`:""}
function waAviso(p,x){
  const d=S.days[sel]; const dl=dayLabel(d.f); const dt=new Date(d.f+"T12:00");
  const trato=p.g==="S"?"":p.g==="N"||p.g==="A"?"":fem(p)?"hermana ":masc(p)?"hermano ":"hermano(a) ";
  const nom=String(p.n).split(/\s+/)[0];
  const pas=(S.app&&S.app.pastor)||"su pastor";
  const cuando=(d.f===todayStr()?"hoy ":"el "+dl.w.toLowerCase()+" "+dt.getDate()+" de "+MESES[dt.getMonth()]+" ")+(x.start!=null?"a las "+hm(x.start):"");
  const msg=`Dios le bendiga, ${trato}${nom}. Le saluda ${pas}. Quisiera visitarle ${cuando.trim()}. ¿Le queda bien? Bendiciones.`;
  return "https://wa.me/57"+encodeURIComponent(p.tel)+"?text="+encodeURIComponent(msg);
}
function markVisited(p,f){if(!f)return;p.uv=f;p.hv=(p.hv||[]).filter(x=>x!==f).concat([f]).sort()}
function unmarkVisited(p,f){if(!p.hv)return;p.hv=p.hv.filter(x=>x!==f);p.uv=p.hv.length?p.hv[p.hv.length-1]:null;if(!p.hv.length)p.hv=null}
function dayCount(d){return d.ids.filter(id=>S.people[id]).length}
function fullMsg(d){const MX=S.cfg.max||5,n=dayCount(d);return n>MX?` (ese día ya tiene ${n}; el máximo es ${MX})`:""}
function okDay(d){const w=new Date(d.f+"T12:00").getDay();return !d.off&&w!==0&&(d.am||d.pm)}
function spreadDays(onlyIdx){
  const MX=S.cfg.max||5,t=todayStr();let moved=0;
  const src=onlyIdx!=null?[S.days[onlyIdx]]:S.days.slice();
  for(const d of src){
    if(!d||d.f<t)continue;
    let room=MX-d.ids.filter(id=>["hecha","encurso"].includes(S.people[id]?.e)).length;
    const keep=[],extra=[];
    for(const id of d.ids){const q=S.people[id];if(!q)continue;if(q.e==="hecha"||q.e==="encurso"){keep.push(id);continue}if(room>0){keep.push(id);room--}else extra.push(id)}
    if(!extra.length)continue;
    d.ids=keep;
    let cur=d.f;
    for(const id of extra){
      let tgt=null,f=cur;
      for(let k=0;k<90;k++){f=addDays(f,1);const td=S.days[ensureDay(f)];if(okDay(td)&&dayCount(td)<MX){tgt=td;break}}
      if(!tgt){d.ids.push(id);continue}
      const q=S.people[id];q.e="p";q.ini=null;q.fin=null;q.conf=false;tgt.ids.push(id);moved++;cur=addDays(tgt.f,-1);
    }
  }
  return moved;
}
function bdayCard(all,t){
  if(!isPastor()&&!all.some(p=>p.nac))return "";
  const y=+t.slice(0,4);
  const L=all.filter(p=>p.nac).map(p=>{let f=y+p.nac.slice(4);if(f<t)f=(y+1)+p.nac.slice(4);const dd=Math.round((new Date(f+"T12:00")-new Date(t+"T12:00"))/864e5);return {p,f,dd}}).filter(x=>x.dd<=7).sort((a,b)=>a.dd-b.dd);
  if(!all.some(p=>p.nac))return `<div class="dcard"><div class="dh">🎂 Cumpleaños</div><div class="status">Escriba la fecha de nacimiento en el perfil de cada persona y aquí verá quién cumple años esta semana.</div></div>`;
  return `<div class="dcard"><div class="dh">🎂 Cumpleaños de la semana</div><div class="big">${L.length}</div>${L.length?L.slice(0,4).map(x=>`<div class="mini"><b class="link" data-sp="${x.p.id}" role="button" tabindex="0">${esc(x.p.n)}</b> · ${x.dd===0?"¡hoy!":dayLabel(x.f).w.toLowerCase()+" "+fmtF(x.f)} · ${edadDe(x.p.nac)+(x.dd===0?0:1)} años</div>`).join(""):`<div class="status">Nadie cumple años en los próximos 7 días.</div>`}</div>`;
}
function backfillUv(){let ch=false;for(const d of S.days)for(const id of d.ids){const q=S.people[id];if(q&&q.e==="hecha"&&!(q.hv||[]).includes(d.f)){markVisited(q,d.f);ch=true}}return ch}

let PRIV=null, lastP={}, lastV={}, lastCfg="", lastPriv="", pendingRender=false;
function isPastor(){return !S||S._role!=="sec"}
function clean(v){return JSON.parse(JSON.stringify(v))}
function sharedOf(p){const o={};for(const k of SHK){const v=p[k];if(v!==undefined&&v!==null&&v!==""&&!(Array.isArray(v)&&!v.length))o[k]=v}return o}
function privOf(){const pv={};for(const p of Object.values(S.people)){const o={};for(const k in p){if(SHK.includes(k))continue;const v=p[k];if(v==null||v===""||v===false||v===0||(k==="e"&&v==="p"))continue;o[k]=v}if(Object.keys(o).length)pv[p.id]=o}
  return {days:S.days,cfg:S.cfg,cases:S.cases||[],pv}}
function save(){
  clearTimeout(saveT); saveT=setTimeout(flush,500);
}
function flush(){
  if(!db||!S) return saving;
  saving=saving.then(async()=>{
    const w=[];
    for(const p of Object.values(S.people)){const j=JSON.stringify(sharedOf(p));if(lastP[p.id]!==j){lastP[p.id]=j;w.push(db.collection("people").doc(p.id).set(JSON.parse(j)))}}
    for(const id of Object.keys(lastP)) if(!S.people[id]){delete lastP[id];w.push(db.collection("people").doc(id).delete())}
    const ids=new Set((S.serv||[]).map(s=>s.id));
    for(const s of S.serv||[]){const j=JSON.stringify(s);if(lastV[s.id]!==j){lastV[s.id]=j;w.push(db.collection("serv").doc(s.id).set(JSON.parse(j)))}}
    for(const id of Object.keys(lastV)) if(!ids.has(id)){delete lastV[id];w.push(db.collection("serv").doc(id).delete())}
    if(isPastor()){
      const cj=JSON.stringify(cfgOf());if(cj!==lastCfg){lastCfg=cj;w.push(db.doc("config/app").set(JSON.parse(cj)))}
      if(PRIV){const pj=JSON.stringify(privOf());if(pj!==lastPriv){lastPriv=pj;w.push(db.doc(PRIV).set({estado:pj,at:Date.now()}))}}
    }
    await Promise.all(w);
  }).catch(()=>{lastP={};lastV={};lastCfg="";lastPriv="";toast("No se pudo guardar en la nube. Revise la conexión; se intentará de nuevo.")});
  return saving;
}
function markSynced(){lastP={};lastV={};for(const p of Object.values(S.people))lastP[p.id]=JSON.stringify(sharedOf(p));for(const s of S.serv||[])lastV[s.id]=JSON.stringify(s);lastCfg=JSON.stringify(cfgOf());lastPriv=PRIV?JSON.stringify(privOf()):""}
function softRender(){const a=document.activeElement;if(a&&a.matches&&a.matches("input,textarea,select")){pendingRender=true;return}render()}
document.addEventListener("focusout",()=>{if(pendingRender){pendingRender=false;setTimeout(()=>{if(!document.activeElement?.matches?.("input,textarea,select"))render();else pendingRender=true},50)}});

/* ---------- cálculo de horarios ---------- */
function schedule(di){
  const day=S.days[di], dur=S.cfg.dur, tr=S.cfg.tr;
  const blocks=[]; if(!day.off){ if(day.am) blocks.push([540,720]); if(day.pm) blocks.push([900,1080]); }
  const t=todayStr(), isToday=day.f===t, past=day.f<t, now=nowMin();
  let cursor=blocks.length?blocks[0][0]:540, bi=0; const out=[]; const MX=S.cfg.max||5; let nv=0;
  for(const id of day.ids){
    const p=S.people[id]; if(!p) continue;
    if(p.e==="hecha"){nv++;out.push({p,start:p.ini,end:p.fin,kind:"done"});cursor=Math.max(cursor,p.fin+tr);continue}
    if(p.e==="encurso"){nv++;const end=p.ini+dur+(p.extra||0);out.push({p,start:p.ini,end,kind:"live"});cursor=Math.max(end,isToday?now:0)+tr;continue}
    if(past){out.push({p,kind:"overflow"});continue}
    if(nv>=MX){out.push({p,kind:"overflow",cap:true});continue}
    let s=cursor; if(isToday) s=Math.max(s,now);
    while(bi<blocks.length){ if(s<blocks[bi][0]) s=blocks[bi][0]; if(s+dur<=blocks[bi][1]+0.01) break; bi++; }
    if(bi>=blocks.length){out.push({p,kind:"overflow"});continue}
    nv++;out.push({p,start:s,end:s+dur,kind:"plan",block:bi});cursor=s+dur+tr;
  }
  return out;
}

/* ---------- acciones ---------- */
function findDay(id){return S.days.findIndex(d=>d.ids.includes(id))}
function act(id,a,arg){
  const p=S.people[id]; const di=findDay(id);
  if(a==="start"){
    for(const k in S.people){const q=S.people[k]; if(q.e==="encurso"&&k!==id){q.e="hecha";q.fin=nowMin()}}
    if(S.days[di].f!==todayStr()){toast("Solo puede iniciar visitas del día de hoy");return}
    p.e="encurso";p.ini=nowMin();p.extra=0;p.np=null;unlockAudio();toast("Visita iniciada: "+p.n);burst(["🙏","🏠"],4);
  }
  if(a==="end"){p.e="hecha";markVisited(p,S.days[di]&&S.days[di].f);p.fin=Math.max(nowMin(),(p.ini||0)+1);toast("🐑 Oveja visitada. Agenda reorganizada.");const dd=S.days[di];const all=dd&&dd.ids.every(x=>S.people[x].e==="hecha");burst(all?["😊","🐑","🎉","🙌"]:["🐑","✅","🎉"],all?10:6);if(all)setTimeout(()=>toast("😊 ¡Terminó todas las visitas del día!"),900)}
  if(a==="conf"){p.conf=!p.conf;toast(p.conf?"👍 Visita confirmada":"Confirmación quitada");if(p.conf)burst("👍",4)}
  if(a==="extra"){p.extra=(p.extra||0)+10;delete fired[id+"5"];delete fired[id+"0"];toast("+10 minutos")}
  if(a==="undo"){unmarkVisited(p,S.days[di]&&S.days[di].f);p.e="p";p.ini=null;p.fin=null;p.extra=0}
  if(a==="noestaba"){p.e="noestaba";p.ini=null;p.fin=null;if(di>=0)S.days[di].ids.splice(S.days[di].ids.indexOf(id),1);p.ne=S.days[di]?.f||"";toast(p.n+" pasó a la lista de espera")}
  if(a==="up"||a==="down"){const ids=S.days[di].ids,i=ids.indexOf(id),j=a==="up"?i-1:i+1;if(j<0||j>=ids.length)return;[ids[i],ids[j]]=[ids[j],ids[i]]}
  if(a==="move"){const to=+arg;if(di>=0)S.days[di].ids.splice(S.days[di].ids.indexOf(id),1);if(p.e!=="hecha"){p.e="p";p.ini=null;p.fin=null}S.days[to].ids.push(id);toast("Pasó al "+dayLabel(S.days[to].f).w+fullMsg(S.days[to]))}
  if(a==="add"){const to=+arg;if(p.e==="noestaba")p.e="p";S.days[to].ids.push(id);toast(p.n+" agregado al "+dayLabel(S.days[to].f).w+fullMsg(S.days[to]))}
  if(a==="remove"){if(di>=0)S.days[di].ids.splice(S.days[di].ids.indexOf(id),1);p.e="p";toast("Pasó a la lista de espera")}
  save();render();
}
function fillGaps(){
  const t=todayStr(); let added=0;
  const wl=waitlist();
  S.days.forEach((d,i)=>{
    if(i!==sel||d.f<t) return;
    while(wl.length){const id=wl[0];d.ids.push(id);const sc=schedule(i);if(sc[sc.length-1].kind==="overflow"){d.ids.pop();break}wl.shift();added++}
  });
  save();render();toast(added?`Se agregaron ${added} visitas a este día`:"Este día no tiene espacios libres");
}
function waitlist(){
  const inDay=new Set(S.days.flatMap(d=>d.ids));
  const ord={S:0,D:1,C:2,M:3,J:4,A:5,N:6};
  return Object.values(S.people).filter(p=>!inDay.has(p.id)&&p.e!=="hecha")
    .sort((a,b)=>(b.e==="noestaba")-(a.e==="noestaba")||ord[a.g]-ord[b.g]||(b.nb?1:0)-(a.nb?1:0)).map(p=>p.id);
}

/* ---------- vista ---------- */
function tagsFor(p){
  let h=`<span class="tag ${p.g}">${gName(p)}</span>`;
  for(const c of (p.cargos||[]).filter(c=>!c.hasta)) h+=`<span class="tag cg">🏅 ${esc(c.cargo)}${c.area?" · "+esc(c.area):""}</span>`;
  if(p.g!=="S"&&p.det) h+=`<span class="tag ${p.nb?"nb":""}">${esc(p.det)}</span>`;
  if(p.edad!=null&&p.edad!==""){const et=etapa(p.edad);if(p.g==="S")h+=`<span class="tag">${et}</span>`}
  const oc=(S.cases||[]).filter(c=>c.pid===p.id&&c.estado!=="Resuelto").length;
  if(oc) h+=`<span class="tag Abierto">${oc} ${oc>1?"casos abiertos":"caso abierto"}</span>`;
  if(p.conf) h+=`<span class="tag conf">👍 Confirmada</span>`;
  if(p.np) h+=`<span class="tag bad">🙅 No pudo ir${p.np.m?": "+esc(p.np.m):""}</span>`;
  if(p.e==="noestaba") h+=`<span class="tag bad">No estaba${p.ne?" ("+dayLabel(p.ne).w+")":""}</span>`;
  return h;
}
function telFor(p){
  const links=p.tel?`<a href="https://wa.me/57${esc(p.tel)}" target="_blank" rel="noopener">💬 WhatsApp</a><a href="tel:${esc(p.tel)}">📞 Llamar</a>`:"";
  return `<div class="tel"><label class="telbox" title="${p.tel?"Modificar celular":"Agregar celular"}"><span>${p.tel?"📱":"📵"}</span><input type="tel" inputmode="tel" id="tel-${p.id}" data-tel="${p.id}" value="${esc(p.tel)}" placeholder="Agregar celular" aria-label="Celular de ${esc(p.n)}"><span class="pen" aria-hidden="true">✏️</span></label>${links}</div>`;
}
const CIVIL=[["soltero","🙂","Solter"],["casado","💍","Casad"],["union","🤝","Unión libre"],["separado","💔","Separad"],["viudo","🖤","Viud"]];
function civilSel(p){
  if(p.g==="A"||p.g==="N") return "";
  const end=gEnd(p);

function animoji(root){
  if(!root||matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode(n){
    const pe=n.parentElement; if(!pe) return NodeFilter.FILTER_REJECT;
    if(pe.closest("select,option,textarea,script,style,.em,.pasture,.lead,.burst")) return NodeFilter.FILTER_REJECT;
    EMO_RE.lastIndex=0; return EMO_RE.test(n.nodeValue)?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT}});
  const nodes=[]; while(w.nextNode()) nodes.push(w.currentNode);
  for(const n of nodes){
    const frag=document.createDocumentFragment();
    for(const part of n.nodeValue.split(EMO_RE)){
      if(!part) continue;
      if(EMO_MAP[part]){const s=document.createElement("span");s.className="em em-"+EMO_MAP[part];s.textContent=part;frag.appendChild(s)}
      else frag.appendChild(document.createTextNode(part));

    n.parentNode.replaceChild(frag,n);
  }
}

function calendar(selF){
  if(!calM) calM=selF.slice(0,7);
  const [y,m]=calM.split("-").map(Number); const first=new Date(y,m-1,1); const lead=(first.getDay()+6)%7; const nd=new Date(y,m,0).getDate();
  const t=todayStr(); const segDates=new Set((S.cases||[]).filter(c=>c.seg&&c.estado!=="Resuelto").map(c=>c.seg));
  let g=["L","M","M","J","V","S","D"].map(x=>`<div class="dn">${x}</div>`).join("");
  for(let i=0;i<lead;i++) g+=`<div class="cd out" aria-hidden="true"></div>`;
  for(let n=1;n<=nd;n++){
    const f=y+"-"+pad(m)+"-"+pad(n); const d=S.days.find(x=>x.f===f);
    const tot=d?d.ids.length:0, done=d?d.ids.filter(id=>S.people[id]?.e==="hecha").length:0;
    let mk="", cls="";
    if(d&&d.off){mk="🚫"} else if(tot&&done===tot){mk="😊";cls=" full"} else if(done){mk="✔️"} else if(tot){mk=`<span class="mk dot">${tot}</span>`}
    if(mk&&!mk.startsWith("<span")) mk=`<span class="mk">${mk}</span>`;
    if(!mk) mk=`<span class="mk"></span>`;
    const lbl=`${n} de ${MESES[m-1]}`+(tot?`, ${done} de ${tot} visitas hechas`:"")+(segDates.has(f)?", seguimiento pendiente":"");
    g+=`<button class="cd${cls}${f===t?" today":""}${f===selF?" sel":""}" data-date="${f}" aria-label="${lbl}"><span class="num">${n}</span>${mk}${segDates.has(f)?'<span class="bell">🔔</span>':""}</button>`;
  }
  return `<section class="cal" aria-label="Calendario"><div class="calhead"><button class="btn sm" data-cm="-1" aria-label="Mes anterior">‹</button><h2>📅 ${MESES[m-1]} ${y}</h2><button class="btn sm" data-cm="1" aria-label="Mes siguiente">›</button></div>
    <div class="calgrid">${g}</div>
    <div class="legend"><span><b style="color:var(--blue)">3</b> visitas programadas</span><span>✔️ día comenzado</span><span>😊 todas las visitas hechas</span><span>🔔 seguimiento</span><span>🚫 no disponible</span></div></section>`;
}

function shrink(file){
  return new Promise((res,rej)=>{const u=URL.createObjectURL(file);const im=new Image();
    im.onload=()=>{const z=320,c=document.createElement("canvas");c.width=z;c.height=z;const k=Math.min(im.width,im.height);
      c.getContext("2d").drawImage(im,(im.width-k)/2,(im.height-k)/2,k,k,0,0,z,z);URL.revokeObjectURL(u);c.toBlob(b=>b?res(b):rej(new Error("x")),"image/jpeg",0.85)};
    im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error("img"))};im.src=u});
}
function photoData(file){

    im.onload=()=>{const z=240,c=document.createElement("canvas");c.width=z;c.height=z;const k=Math.min(im.width,im.height);

    im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error("img"))};im.src=u});
}

function unlockAudio(){try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();audioCtx.resume()}catch(e){}}

function tick(){
  if(!S) return;
  const t=todayStr(), di=S.days.findIndex(d=>d.f===t); if(di<0) return;
  const sc=schedule(di), live=sc.find(x=>x.kind==="live");

    const rem=live.end-nowMin();
    if(rem<=5&&rem>0&&!fired[live.p.id+"5"]){fired[live.p.id+"5"]=1;beep(1);toast("Quedan 5 minutos de visita")}
    if(rem<=0&&!fired[live.p.id+"0"]){fired[live.p.id+"0"]=1;beep(3);toast("Se cumplió el tiempo de la visita")}
    if(sel===di){const c=$("#clock");if(c)c.textContent=fmtRem(rem);const b=$("#livebox");if(b)b.className="now "+(rem<0?"over":"live")}
  }else{
    const next=sc.find(x=>x.kind==="plan");
    if(next){const m=next.start-nowMin();if(m<=10&&m>0&&!fired[next.p.id+"n"]){fired[next.p.id+"n"]=1;beep(1);toast("En 10 min: "+next.p.n)}}
  }
}

function migrate(){
  let changed=false;
  for(const f of weekOf(todayStr())){ if(!S.days.some(d=>d.f===f)){ S.days.push({f,am:true,pm:true,ids:[]}); changed=true; } }
  S.days.sort((a,b)=>a.f<b.f?-1:1);
  return changed;
}

      const j=JSON.stringify(sharedOf(Object.assign({},d,{id})));if(lastP[id]===j)continue;
      for(const k of SHK)delete p[k];Object.assign(p,d,{id});lastP[id]=JSON.stringify(sharedOf(p));ch=true}

  db.collection("serv").limit(1000).onSnapshot(snap=>{let ch=false;

const ICN_RE=new RegExp("("+Object.keys(ICN).sort((a,b)=>b.length-a.length).map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|")+")\\s?","gu");
function animoji(root){
  if(!root) return;
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode(n){
    const pe=n.parentElement; if(!pe||pe.closest("textarea,script,style,svg")) return NodeFilter.FILTER_REJECT;
    ICN_RE.lastIndex=0; return ICN_RE.test(n.nodeValue)?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT}});
  const nodes=[]; while(w.nextNode()) nodes.push(w.currentNode);
  for(const n of nodes){
    if(n.parentElement.closest("option,select,title")){n.nodeValue=n.nodeValue.replace(ICN_RE,"");continue}
    const frag=document.createDocumentFragment(); let last=0, m; const s=n.nodeValue; ICN_RE.lastIndex=0;
    while((m=ICN_RE.exec(s))){
      if(m.index>last) frag.appendChild(document.createTextNode(s.slice(last,m.index)));
      const name=ICN[m[1]]; const sp=document.createElement("span");
      if(name.startsWith("dot-")) sp.className="sdot "+name; else {sp.className="icw";sp.innerHTML=svgIcon(name)}
      frag.appendChild(sp);
      if(m[0].length>m[1].length) frag.appendChild(document.createTextNode(" "));
      last=m.index+m[0].length;
    }
    if(last<s.length) frag.appendChild(document.createTextNode(s.slice(last)));
    n.parentNode.replaceChild(frag,n);
  }
}

/* ===== Inicio ===== */
function saludo(){const h=new Date().getHours();return h<12?"Buenos días":h<19?"Buenas tardes":"Buenas noches"}
function viewInicio(t){
  const a=S.app||{}; const d=new Date(t+"T12:00");
  const L=servs(), last=L[0], all=Object.values(S.people);
  let h=`<section class="hello"><div class="status">${DAYN[d.getDay()]} ${d.getDate()} de ${MESES[d.getMonth()]}</div><h2>${saludo()}${a.pastor?", "+esc(a.pastor):""}</h2></section><div class="dash">`;
  if(isPastor()){
    const di=S.days.findIndex(x=>x.f===t); let hoy=`<div class="status">No hay visitas agendadas para hoy.</div>`;
    if(di>=0){const sc=schedule(di);const pend=sc.filter(x=>x.kind==="plan"||x.kind==="live");const done=sc.filter(x=>x.kind==="done").length;
      hoy=`<div class="big">${done}<small> de ${sc.length}</small></div><div class="status">visitas realizadas hoy</div>${pend[0]?`<div class="nextv">Siguiente: <b class="link" data-sp="${pend[0].p.id}">${esc(pend[0].p.n)}</b>${pend[0].start!=null?" · "+hm(pend[0].start):""}</div>`:""}`}
    h+=`<button class="dcard" data-view="agenda"><div class="dh">🗓️ Visitas de hoy</div>${hoy}</button>`;
  }
  if(last){const tot=all.length;const avg=Math.round(L.slice(0,4).reduce((s,v)=>s+v.pres.length,0)/Math.min(4,L.length));
    const bars=L.slice(0,8).reverse();const mx=Math.max(1,...bars.map(b=>b.pres.length));
    h+=`<button class="dcard" data-view="asis"><div class="dh">✋ Último servicio</div><div class="big">${last.pres.length}<small> de ${tot}</small></div><div class="status">${esc(last.tipo)} · ${fmtF(last.f)} · promedio ${avg}</div>
      <div class="spark" aria-hidden="true">${bars.map(b=>`<i style="height:${Math.max(8,Math.round(b.pres.length/mx*100))}%"></i>`).join("")}</div></button>`;
  } else h+=`<button class="dcard" data-view="asis"><div class="dh">✋ Asistencia</div><div class="status">Todavía no hay servicios registrados. Toque aquí para pasar lista.</div></button>`;
  if(isPastor()){
    const lim=addDays(t,3);const due=(S.cases||[]).filter(c=>c.estado!=="Resuelto"&&c.seg&&c.seg<=lim).sort((a,b)=>a.seg<b.seg?-1:1);
    const open=(S.cases||[]).filter(c=>c.estado!=="Resuelto").length;
    h+=`<button class="dcard ${due.length?"due":""}" data-view="cuidado"><div class="dh">🔔 Seguimientos</div><div class="big">${due.length}<small> próximos</small></div><div class="status">${open} casos abiertos en total</div>${due.slice(0,3).map(c=>`<div class="mini">${esc((S.people[c.pid]||{n:"?"}).n)} · ${fmtF(c.seg)}</div>`).join("")}</button>`;
    const ap=all.filter(p=>p.apart).length, sug=all.filter(p=>!p.apart&&p.g!=="S"&&p.g!=="N"&&attStats(p.id).streak>=3).length;
    h+=`<button class="dcard" data-view="apart"><div class="dh">🔍 Apartados</div><div class="big">${ap}</div><div class="status">${sug?`${sug} con 3 faltas seguidas`:"Ninguna alerta nueva"}</div></button>`;
  }
  const cg=all.filter(p=>(p.cargos||[]).some(c=>!c.hasta)).length;
  const cnt=g=>all.filter(p=>p.g===g).length;
  h+=`<button class="dcard" data-view="rebano"><div class="dh">🐑 Rebaño</div><div class="big">${all.length}</div><div class="status">${cnt("D")} damas · ${cnt("C")} caballeros · ${cnt("J")} jóvenes · ${cnt("A")} adolescentes · ${cnt("N")} niños · ${cnt("M")} ancianos · ${cnt("S")} simpatizantes · ${cg} con cargo</div></button>${bdayCard(all,t)}</div>`;
  h+=`<section class="block"><div class="bhead"><h3>Accesos rápidos</h3></div><div class="quick">
    <button class="btn" data-view="asis">✋ Pasar lista</button>
    <button class="btn" id="qopen2">🔎 Buscar persona</button>
    ${isPastor()?`<button class="btn" id="openrep">🖨️ Informe del mes</button>`:""}
    <button class="btn" id="openguide">🧭 Guía de inicio</button>
    <button class="btn" id="openvideo">▶️ Video guía</button></div></section><div class="status ver">${BRAND} · versión ${APPV}</div>`;
  return h;
}

/* ===== Informe mensual ===== */
let repMonth=null;
function reportHtml(){
  const ym=repMonth||todayStr().slice(0,7); const [y,m]=ym.split("-").map(Number);
  const a=S.app||{}; const all=Object.values(S.people);
  const sv=(S.serv||[]).filter(s=>s.f.slice(0,7)===ym).sort((x,z)=>x.f<z.f?-1:1);
  const avg=sv.length?Math.round(sv.reduce((s,v)=>s+v.pres.length,0)/sv.length):0;
  const byG=g=>{const ids=new Set(all.filter(p=>p.g===g).map(p=>p.id));return sv.length?Math.round(sv.reduce((s,v)=>s+v.pres.filter(i=>ids.has(i)).length,0)/sv.length):0};
  let visits=0; for(const d of S.days||[]) if(d.f.slice(0,7)===ym) for(const id of d.ids) if(S.people[id]&&S.people[id].e==="hecha") visits++;
  const cases=(S.cases||[]).filter(c=>c.fecha&&c.fecha.slice(0,7)===ym);
  const tipos={};for(const c of cases)tipos[c.tipo]=(tipos[c.tipo]||0)+1;
  const rest=all.filter(p=>p.rest&&p.rest.slice(0,7)===ym);
  const ap=all.filter(p=>p.apart);
  const cons=all.filter(p=>{const s=attStats(p.id);return s.tot&&s.pct>=75}).length;
  const opts=[];for(let i=0;i<12;i++){const dd=new Date(new Date().getFullYear(),new Date().getMonth()-i,1);const k=dd.getFullYear()+"-"+pad(dd.getMonth()+1);opts.push(`<option value="${k}" ${k===ym?"selected":""}>${MESES[dd.getMonth()]} ${dd.getFullYear()}</option>`)}
  return `<div class="repbar noprint"><select id="repm" aria-label="Mes del informe">${opts.join("")}</select><span class="spacer"></span><button class="btn sm pri" id="repprint">🖨️ Imprimir o guardar PDF</button><button class="btn sm" id="repclose">✖️ Cerrar</button></div>
  <article class="rep">
    <header class="rhead"><div><div class="rbrand">${BRAND}</div><h1>Informe pastoral · ${MESES[m-1]} ${y}</h1><div class="status">${esc(a.iglesia||"")}${a.pastor?" · "+esc(a.pastor):""}</div></div><div class="status">Generado el ${fmtF(todayStr())} ${todayStr().slice(0,4)}</div></header>
    <section><h2>Resumen</h2><div class="kpis">
      <div><b>${all.length}</b><span>personas en el rebaño</span></div>
      <div><b>${sv.length}</b><span>servicios registrados</span></div>
      <div><b>${avg}</b><span>asistencia promedio</span></div>
      <div><b>${visits}</b><span>visitas realizadas</span></div>
      <div><b>${cases.length}</b><span>necesidades atendidas</span></div>
      <div><b>${ap.length}</b><span>hermanos apartados</span></div></div></section>
    <section><h2>Asistencia</h2>${sv.length?`<table><thead><tr><th>Fecha</th><th>Servicio</th><th>Presentes</th></tr></thead><tbody>${sv.map(s=>`<tr><td>${dayLabel(s.f).w} ${fmtF(s.f)}</td><td>${esc(s.tipo)}</td><td>${s.pres.length}</td></tr>`).join("")}</tbody></table>
      <p class="status">Promedio por grupo: damas ${byG("D")} · caballeros ${byG("C")} · jóvenes ${byG("J")} · adolescentes ${byG("A")} · niños ${byG("N")} · ancianos ${byG("M")} · simpatizantes ${byG("S")}. Personas constantes (75% o más de asistencia): ${cons}.</p>`:`<p class="status">No hay servicios registrados este mes.</p>`}</section>
    <section><h2>Cuidado pastoral</h2>${cases.length?`<p>${Object.entries(tipos).map(([k,v])=>`${esc(k)}: ${v}`).join(" · ")}</p><p class="status">Resueltos: ${cases.filter(c=>c.estado==="Resuelto").length} de ${cases.length}.</p>`:`<p class="status">No se anotaron necesidades este mes.</p>`}</section>
    <section><h2>Restauración</h2><p>${rest.length?`Restaurados este mes: ${rest.map(p=>esc(p.n)).join(", ")}.`:"No hubo restauraciones registradas este mes."} Apartados actualmente: ${ap.length}.</p></section>
    <footer class="status">Los nombres de personas con problemas pastorales no aparecen en este informe, para cuidar su privacidad.</footer>
  </article>`;
}
function openReport(){repMonth=repMonth||todayStr().slice(0,7);const r=$("#report");r.innerHTML=reportHtml();r.hidden=false;document.body.classList.add("hasrep");animoji(r);window.scrollTo(0,0)}
function closeReport(){const r=$("#report");r.hidden=true;r.innerHTML="";document.body.classList.remove("hasrep")}

 ["🐑","Rebaño","Aquí está la lista de todas las personas. Puede agregar personas, buscarlas y actualizar sus datos: celular, edad, estado civil y cargos."],
 ["✋","Asistencia","Cree el servicio del día y toque a cada persona presente. La app calcula sola la frecuencia de cada uno."],
 ["🔎","Perfil de cada persona","Toque el nombre de cualquier persona para ver su perfil completo. Con Editar puede cambiar sus datos."]];
let guideI=0;
function openGuide(){guideI=0;renderGuide();$("#guide").hidden=false}
function closeGuide(){$("#guide").hidden=true;try{localStorage.setItem(LS+"-guia-"+(isPastor()?"p":"s"),"1")}catch(e){}}
function renderGuide(){const G=isPastor()?GUIDE_P:GUIDE_S;const [ic,t,tx]=G[guideI];
  $("#guide").innerHTML=`<div class="gbox" role="dialog" aria-modal="true" aria-label="Guía de inicio"><div class="gic">${ic}</div><h2>${esc(t)}</h2><p>${esc(tx)}</p>
    <div class="gdots">${G.map((_,i)=>`<i class="${i===guideI?"on":""}"></i>`).join("")}</div>
    ${guideI===G.length-1?`<button class="btn sm" id="openvideo">▶️ Ver video guía</button>`:""}<div class="row"><button class="btn sm ghost" id="gskip">Saltar</button><span class="spacer"></span>${guideI>0?`<button class="btn sm" id="gprev">Anterior</button>`:""}<button class="btn sm pri" id="gnext">${guideI<G.length-1?"Siguiente":"Empezar"}</button></div></div>`;
  animoji($("#guide"))}
function openVideo(){const v=$("#vplayer");
  v.innerHTML=`<div class="gbox vbox" role="dialog" aria-modal="true" aria-label="Video guía"><div class="row"><b style="flex:1;text-align:left">Video guía</b><button class="btn sm ghost" id="vclose" aria-label="Cerrar">✖️</button></div>
    <video src="guia.mp4" controls playsinline preload="metadata" poster="icon-512.png"></video>
    <div class="status" id="verr" hidden>No se pudo cargar el video. Revise su conexión a internet.</div></div>`;
  v.hidden=false;animoji(v);const vid=v.querySelector("video");vid.addEventListener("error",()=>{$("#verr").hidden=false});vid.play().catch(()=>{})}
function closeVideo(){const v=$("#vplayer");const vid=v.querySelector("video");if(vid)vid.pause();v.hidden=true;v.innerHTML=""}
function maybeGuide(){try{if(!localStorage.getItem(LS+"-guia-"+(isPastor()?"p":"s")))openGuide()}catch(e){}}
function extraClick(b){if(b.id==="spread"){const m=spreadDays(sel);save();render();toast(m?`📅 ${m} visitas pasaron a los días siguientes`:"No hay visitas para repartir");return true}
  if(b.id==="openrep"){openReport();return true}
  if(b.id==="repclose"){closeReport();return true}
  if(b.id==="repprint"){window.print();return true}
  if(b.id==="openguide"){openGuide();return true}
  if(b.id==="openvideo"){closeGuide();openVideo();return true}
  if(b.id==="vclose"){closeVideo();return true}
  if(b.id==="gskip"){closeGuide();return true}
  if(b.id==="gnext"){const G=isPastor()?GUIDE_P:GUIDE_S;if(guideI<G.length-1){guideI++;renderGuide()}else closeGuide();return true}
  if(b.id==="gprev"){guideI=Math.max(0,guideI-1);renderGuide();return true}
  if(b.id==="qopen2"){sheetQ="";openSheet();return true}
  if(b.id==="sedit"||b.id==="sedit2"||b.id==="sedit3"){const ae=document.activeElement;if(ae&&ae.blur)ae.blur();sheetEdit=!sheetEdit;render();const sb=$("#sheet .sheetbox")||$("#sheet");if(sheetEdit){const e=$("#sheet .editing");if(e)e.scrollIntoView({block:"start",behavior:"smooth"})}return true}
  return false;
}

/* ---------- Firebase ---------- */
const firebaseConfig=window.REDIL_FIREBASE;
if(!firebaseConfig){document.body.innerHTML='<p style="padding:24px;font-family:system-ui">Falta el archivo config.js con la conexión a Firebase.</p>';throw new Error("config")}
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth();
db=firebase.firestore();
try{db.enablePersistence({synchronizeTabs:true}).catch(()=>{})}catch(e){}
PRIV="privado/pastor";
if("serviceWorker" in navigator){window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{})})}
function showLogin(msg){$("#login").hidden=false;$("#logout").hidden=true;$("#lerr").textContent=msg||"";$("#main").innerHTML="";$("#tabbar").innerHTML="";$("#qopen").hidden=true}
function hideLogin(){$("#login").hidden=true;$("#logout").hidden=false;$("#qopen").hidden=false}
const AUTH_ERR={"auth/invalid-email":"Ese correo no es válido.","auth/user-not-found":"Correo o contraseña incorrectos.","auth/wrong-password":"Correo o contraseña incorrectos.","auth/invalid-credential":"Correo o contraseña incorrectos.","auth/too-many-requests":"Demasiados intentos. Espere unos minutos e intente de nuevo.","auth/network-request-failed":"No hay conexión a internet."};
$("#lform").addEventListener("submit",async e=>{e.preventDefault();const em=$("#lemail").value.trim(),pw=$("#lpass").value;
  if(!em||!pw){$("#lerr").textContent="Escriba su correo y su contraseña.";return}
  $("#lgo").disabled=true;$("#lerr").textContent="Entrando…";
  try{await auth.signInWithEmailAndPassword(em,pw)}catch(err){$("#lerr").textContent=AUTH_ERR[err.code]||"No se pudo entrar. Revise sus datos."}
  $("#lgo").disabled=false});
$("#lforgot").addEventListener("click",async()=>{const em=$("#lemail").value.trim();if(!em){$("#lerr").textContent="Escriba primero su correo arriba.";return}
  try{await auth.sendPasswordResetEmail(em);$("#lerr").textContent="Le enviamos un correo para cambiar la contraseña."}catch(err){$("#lerr").textContent=AUTH_ERR[err.code]||"No se pudo enviar el correo."}});
$("#logout").addEventListener("click",async()=>{await auth.signOut();location.reload()});

async function loadAll(){
  $("#main").innerHTML='<div class="empty" id="loading">Cargando el redil…</div>';
  let role="sec",pr=null;
  try{pr=await db.doc(PRIV).get();role="pastor"}catch(e){role="sec"}
  let ps,vs,cf;
  try{[ps,vs,cf]=await Promise.all([db.collection("people").limit(1000).get(),db.collection("serv").limit(1000).get(),db.doc("config/app").get()])}
  catch(e){$("#main").innerHTML='<div class="empty">🔒 Su usuario todavía no tiene permiso para ver el redil. Pídale al pastor que lo agregue.</div>';return}
  if(role==="pastor"&&!ps.docs.length&&!(cf.exists&&cf.data().started)){showImport();return}
  S=buildS(ps,vs,cf,pr&&pr.exists?pr.data().estado:null,role);
  markSynced();let ch=false;if(role==="pastor"){ch=migrate()||ch;if(backfillUv())ch=true}if(ageSync())ch=true;if(role==="pastor"&&S.cfg.max==null){S.cfg.max=5;const m=spreadDays();ch=true;if(m)setTimeout(()=>toast(`📅 Ahora el máximo es 5 visitas por día: ${m} visitas pasaron a los días siguientes`),1800)}if(ch)save();
  pickDay();render();subscribe();maybeGuide();
}
auth.onAuthStateChanged(u=>{if(!u){S=null;showLogin();return}hideLogin();loadAll()});

/* ---------- importar y copia de seguridad ---------- */
function showImport(){
  $("#tabbar").innerHTML="";
  $("#main").innerHTML=`<section class="block"><div class="bhead"><h2>⛪ Bienvenido, pastor</h2></div>
    <div class="status">Escriba los datos de su iglesia para empezar.</div>
    <input type="text" id="st-pastor" placeholder="Nombre del pastor (ej. Pastor Juan Pérez)" aria-label="Nombre del pastor">
    <input type="text" id="st-iglesia" placeholder="Nombre de la iglesia" aria-label="Nombre de la iglesia">
    <button class="btn pri" id="ststart">🐑 Empezar con el rebaño vacío</button>
    <div class="status" style="margin-top:6px">¿Ya tiene un archivo de datos (.json) de otra app Redil o de una copia de seguridad? Cárguelo aquí:</div>
    <label class="btn" style="text-align:center">📂 Cargar archivo de datos<input type="file" id="impf" accept=".json,application/json" class="vh"></label>
    <div class="status" id="impst"></div></section>`;
  $("#ststart").onclick=async()=>{const pa=$("#st-pastor").value.trim(),ig=$("#st-iglesia").value.trim();
    if(!pa){$("#impst").textContent="Escriba el nombre del pastor.";return}
    $("#impst").textContent="Preparando…";
    try{await db.doc("config/app").set({pastorFoto:null,iglesia:ig,pastor:pa,verso:"",started:true});
      await db.doc(PRIV).set({estado:JSON.stringify({days:[],cfg:{dur:30,tr:0},cases:[],pv:{}}),at:Date.now()});
      burst(["🐑","🎉"],8);loadAll()}catch(e){$("#impst").textContent="No se pudo guardar. Revise la conexión."}};
}
document.addEventListener("change",e=>{if(e.target.id==="impf"&&e.target.files&&e.target.files[0])importData(e.target.files[0])},true);
async function importData(file){
  const st=$("#impst");st.textContent="Leyendo archivo…";
  try{
    const data=JSON.parse(await file.text());
    if(!data.people||typeof data.people!=="object") throw new Error("formato");
    const ops=[];
    for(const [id,p] of Object.entries(data.people)) ops.push(["set",db.collection("people").doc(id),Object.assign({},p,{id})]);
    for(const s of data.serv||[]) ops.push(["set",db.collection("serv").doc(s.id),s]);
    ops.push(["set",db.doc("config/app"),Object.assign({pastorFoto:data.pastorFoto||null,iglesia:"",pastor:"",verso:""},data.app||{},{started:true})]);
    if(data.priv) ops.push(["set",db.doc(PRIV),{estado:JSON.stringify(data.priv),at:Date.now()}]);
    for(let k=0;k<ops.length;k+=400){const b=db.batch();for(const [,ref,val] of ops.slice(k,k+400))b.set(ref,val);await b.commit();st.textContent=`Guardando… ${Math.min(k+400,ops.length)} de ${ops.length}`}
    st.textContent="✅ Datos cargados.";burst(["🐑","🎉","🙌"],10);
    setTimeout(loadAll,600);
  }catch(e){st.textContent="No se pudo leer ese archivo. Asegúrese de elegir datos-redil.json."}
}
function downloadBackup(){
  const people={};for(const p of Object.values(S.people))people[p.id]=sharedOf(p);
  const data={formato:"redil",version:2,fecha:new Date().toISOString(),people,serv:S.serv||[],pastorFoto:S.pastorFoto||null,app:S.app||{},priv:isPastor()?privOf():null};
  const blob=new Blob([JSON.stringify(data)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="redil-copia-"+todayStr()+".json";document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);toast("💾 Copia descargada");
}
</script>
