<style>

<style>
/* Layout: minimalista; cabecera clara con la semana en píldoras, calendario arriba, tarjetas planas con línea fina */
:root{
  --bg:#f4f6f5; --surface:#ffffff; --ink:#1c2321; --muted:#6a7571; --line:#e3e8e6;
  --blue:#0f7a68; --blue-2:#12907b; --sky:#e2f2ed; --gold:#d27a2c; --gold-soft:#fcefe2;
  --ok:#2f8a57; --ok-soft:#e5f4ea; --warn:#a8650c; --warn-soft:#fbefd9; --bad:#c2453b; --bad-soft:#fbe7e5; --vio:#6a4bc4; --vio-soft:#ece6fb; --pink:#b8407a; --pink-soft:#fde6f0;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101413; --surface:#181e1c; --ink:#e7ecea; --muted:#94a19c; --line:#27302d;
  --blue:#4fc7ad; --blue-2:#6fd6bf; --sky:#16302a; --gold:#f0a25a; --gold-soft:#36261a;
  --ok:#72d39a; --ok-soft:#15301f; --warn:#f2bb60; --warn-soft:#352a14; --bad:#ff8a7f; --bad-soft:#3b1a17; --vio:#b9a2ff; --vio-soft:#2a2145; --pink:#ff8fc0; --pink-soft:#3d1a2b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101413; --surface:#181e1c; --ink:#e7ecea; --muted:#94a19c; --line:#27302d;
  --blue:#4fc7ad; --blue-2:#6fd6bf; --sky:#16302a; --gold:#f0a25a; --gold-soft:#36261a;
  --ok:#72d39a; --ok-soft:#15301f; --warn:#f2bb60; --warn-soft:#352a14; --bad:#ff8a7f; --bad-soft:#3b1a17; --vio:#b9a2ff; --vio-soft:#2a2145; --pink:#ff8fc0; --pink-soft:#3d1a2b; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{background:var(--surface);border-bottom:1px solid var(--line);padding-block:18px 14px}
.brand{display:flex;align-items:center;gap:14px}
.pastor{position:relative;flex:none;width:64px;height:64px;border-radius:50%;padding:3px;background:conic-gradient(var(--blue),var(--gold),var(--blue));cursor:pointer;transition:transform .15s}

.pastor img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;border:2px solid var(--surface)}
.pastor .staff{position:absolute;right:-6px;bottom:-4px;font-size:1.05rem;background:var(--surface);border-radius:50%;width:26px;height:26px;display:grid;place-items:center;box-shadow:0 0 0 1px var(--line)}
.verse{font-size:.8rem;color:var(--muted);font-style:italic;margin-top:2px}
.flock{display:flex;flex-direction:column;gap:8px;margin-top:14px;padding:12px 14px;border-radius:16px;background:var(--bg);border:1px solid var(--line)}

.lead{position:absolute;top:50%;transform:translate(-50%,-62%);font-size:1.25rem;transition:left .6s}

.ftitle{display:flex;justify-content:space-between;gap:8px;font-size:.82rem;font-weight:700}

.logo{width:42px;height:42px;border-radius:12px;background:var(--sky);display:grid;place-items:center;font-size:1.35rem;flex:none}

.day{background:transparent;border:1px solid transparent;color:var(--muted);padding:7px 2px;border-radius:12px;cursor:pointer;font:inherit;text-align:center;transition:transform .15s,background .2s}

.ico{font-size:1.5rem;display:inline-block}
.live .ico{animation:sway 2.4s ease-in-out infinite}
.now .who{font-weight:700}.now .hint{color:var(--muted);font-size:.9rem}
.sec{font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;display:flex;gap:8px;align-items:center}

.list{display:flex;flex-direction:column;gap:8px}
.visit{display:grid;grid-template-columns:64px 1fr;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.visit .t{font-variant-numeric:tabular-nums;font-weight:700;color:var(--blue);font-size:1rem}
.visit .t small{display:block;font-weight:500;color:var(--muted);font-size:.76rem}
.visit.done{opacity:.7}.visit.done .t{color:var(--ok)}
.visit.live{border-color:var(--gold)}
.visit.overflow .t{color:var(--bad)}
.body{min-width:0;display:flex;flex-direction:column;gap:7px}
.name{font-weight:700;font-size:1.03rem;overflow-wrap:anywhere}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{font-size:.74rem;padding:2px 8px;border-radius:999px;background:var(--bg);color:var(--muted);font-weight:600;border:1px solid var(--line)}
.tag.S{background:var(--sky);color:var(--blue);border-color:transparent}
.tag.nb{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.tag.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.tag.bad,.tag.Abierto{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.tag.En{background:var(--warn-soft);color:var(--warn);border-color:transparent}.tag.Resuelto{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.tel{font-size:.86rem;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tel a{color:var(--blue);font-weight:600;text-decoration:none;padding:3px 9px;border-radius:999px;background:var(--sky)}
.acts{display:flex;flex-wrap:wrap;gap:6px}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:8px 12px;font:inherit;font-size:.9rem;font-weight:600;cursor:pointer;transition:transform .15s,box-shadow .15s}
.btn.pri{background:var(--blue);color:var(--surface);border-color:var(--blue)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--surface)}
.btn.sm{padding:6px 10px;font-size:.83rem;font-weight:500}
.btn:hover,.chip:hover{box-shadow:0 2px 8px rgba(0,0,0,.08)}
.btn:active,.chip:active,.day:active,.cd:active{transform:scale(.92)}
.btn:focus-visible,.chip:focus-visible,.day:focus-visible,.cd:focus-visible{outline:3px solid var(--blue-2);outline-offset:2px}
textarea{width:100%;min-height:60px;border:1px solid var(--line);border-radius:12px;padding:8px 10px;font:inherit;font-size:.92rem;background:var(--bg);color:var(--ink);resize:vertical}
.empty{color:var(--muted);text-align:center;padding:22px;border:1px dashed var(--line);border-radius:16px}
.lunch{color:var(--muted);font-size:.85rem;text-align:center;padding:2px}
details.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
details.panel summary{cursor:pointer;font-weight:700}
.wl{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.wlrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 0;border-top:1px solid var(--line)}
.wlrow .nm{flex:1;min-width:150px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
select{font:inherit;font-size:.86rem;padding:6px 8px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;font-size:.92rem;max-width:calc(100% - 32px);z-index:9}
.status{font-size:.8rem;color:var(--muted)}
.cal{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 12px;width:100%;max-width:400px;align-self:center}
.calhead{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.calhead h2{font-weight:700;font-size:.98rem;margin:0;flex:1;text-transform:capitalize}
.calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.calgrid .dn{font-size:.72rem;text-align:center;color:var(--muted);font-weight:700}
.cd{position:relative;height:38px;max-width:100%;border:1px solid transparent;border-radius:12px;background:transparent;color:var(--ink);font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:2px;min-width:0;transition:transform .15s,background .2s}
.cd:hover{background:var(--bg)}
.cd .num{font-size:.78rem;font-variant-numeric:tabular-nums}
.cd .mk{font-size:.72rem;line-height:1;min-height:1em}
.cd .mk.dot{font-size:.6rem;color:var(--blue);font-weight:700;background:var(--sky);border-radius:999px;padding:1px 5px;min-height:0}
.cd.out{visibility:hidden}
.cd.today{border-color:var(--gold)}
.cd.sel{background:var(--blue);color:var(--surface)}
.cd.full{background:var(--ok-soft)}.cd.full.sel{background:var(--blue)}
.cd .bell{position:absolute;top:1px;right:2px;font-size:.55rem}
.whorow{display:flex;gap:10px;align-items:center;min-width:0}
.min0{min-width:0;display:flex;flex-direction:column;gap:4px}
.av{position:relative;flex:none;width:var(--s,46px);height:var(--s,46px);border-radius:50%;overflow:hidden;display:grid;place-items:center;background:var(--sky);color:var(--blue);font-weight:700;font-size:calc(var(--s,46px)*.36);cursor:pointer;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line);transition:transform .15s}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.telbox{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:999px;padding:1px 8px;background:var(--surface)}
.telbox input{width:8.5em;border:0;background:transparent;color:var(--ink);font:inherit;font-variant-numeric:tabular-nums;padding:3px 0}
.telbox input::placeholder{color:var(--muted)}
.telbox .pen{font-size:.72rem;opacity:.7}
.telbox:focus-within{outline:2px solid var(--blue-2)}
.telbox input:focus{outline:none}
select.civil{font-size:.76rem;padding:2px 6px;border-radius:999px}
.agebox{display:inline-flex;align-items:center;gap:3px;font-size:.78rem;border:1px solid var(--line);border-radius:999px;padding:1px 4px 1px 7px;background:var(--surface)}
.agebox input{width:3.6em;border:0;background:transparent;color:var(--ink);font:inherit;font-weight:700;padding:2px 2px;text-align:center}
.agebox input:focus{outline:2px solid var(--blue-2);border-radius:6px}
.tag.A{background:var(--vio-soft);color:var(--vio);border-color:transparent}.tag.N{background:var(--pink-soft);color:var(--pink);border-color:transparent}
.av.A{background:var(--vio-soft);color:var(--vio)}.av.N{background:var(--pink-soft);color:var(--pink)}
.av.D{background:var(--warn-soft);color:var(--warn)}.av.S{background:var(--sky);color:var(--blue)}.av.C{background:var(--ok-soft);color:var(--ok)}
label.av:active{transform:scale(.92)}
.av .cam{position:absolute;right:-1px;bottom:-1px;font-size:.62rem;background:var(--surface);border-radius:50%;width:18px;height:18px;display:grid;place-items:center;box-shadow:0 0 0 1px var(--line)}
.av.busy{opacity:.5}
.vh{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.offbox{display:flex;flex-direction:column;gap:8px;background:var(--bad-soft);border:1px solid var(--bad);border-radius:16px;padding:12px 14px}
.chip.off[aria-pressed="true"]{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.tag.conf{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.legend{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:8px;font-size:.7rem;justify-content:center;color:var(--muted)}
.case{border-top:1px solid var(--line);padding:10px 0;display:flex;flex-direction:column;gap:6px}
.case:first-of-type{border-top:0}
.casehead{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.casehead .name{font-size:.98rem;flex:1;min-width:140px}
.case .txt{white-space:pre-wrap;overflow-wrap:anywhere}
.notes{display:flex;flex-direction:column;gap:4px;padding-left:10px;border-left:2px solid var(--line)}
.notes div{font-size:.88rem}.notes small{color:var(--muted)}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.row input[type=text]{flex:1;min-width:160px}
input[type=text],input[type=date]{font:inherit;font-size:.9rem;padding:7px 9px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.probform{display:flex;flex-direction:column;gap:6px;background:var(--bg);border-radius:12px;padding:10px}
.burst{position:fixed;pointer-events:none;z-index:20;font-size:1.6rem;animation:fly 1s ease-out forwards}
@keyframes fly{0%{transform:translate(-50%,-50%) scale(.6);opacity:1}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% - 90px)) scale(1.2);opacity:0}}
@keyframes sway{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
.em{display:inline-block;will-change:transform}
.em-door{transform-origin:15% 50%;animation:door 2.8s ease-in-out infinite}
@keyframes door{0%,55%,100%{transform:perspective(60px) rotateY(0)}18%,40%{transform:perspective(60px) rotateY(-60deg)}}
.em-thumb{transform-origin:30% 80%;animation:thumb 1.8s ease-in-out infinite}
@keyframes thumb{0%,60%,100%{transform:rotate(0) translateY(0)}20%{transform:rotate(-14deg) translateY(-3px)}40%{transform:rotate(6deg)}}
.em-play{animation:play 1.4s ease-in-out infinite}
@keyframes play{0%,100%{transform:translateX(0)}50%{transform:translateX(3px) scale(1.1)}}
.em-pop{animation:pop 2.2s ease-in-out infinite}
@keyframes pop{0%,70%,100%{transform:scale(1)}80%{transform:scale(1.3)}90%{transform:scale(.92)}}
.em-tick{animation:tick 1s steps(2) infinite}
@keyframes tick{0%{transform:rotate(-8deg)}100%{transform:rotate(8deg)}}
.em-write{transform-origin:20% 90%;animation:write 1.2s ease-in-out infinite}
@keyframes write{0%,100%{transform:translate(0,0) rotate(0)}25%{transform:translate(2px,-1px) rotate(-6deg)}50%{transform:translate(4px,0) rotate(4deg)}75%{transform:translate(2px,1px) rotate(-3deg)}}
.em-undo{animation:undo 2.4s ease-in-out infinite}
@keyframes undo{0%,60%,100%{transform:rotate(0)}30%{transform:rotate(-200deg)}}
.em-talk{transform-origin:20% 90%;animation:talk 1.6s ease-in-out infinite}
@keyframes talk{0%,100%{transform:scale(1)}30%{transform:scale(1.18) rotate(-4deg)}60%{transform:scale(.96)}}
.em-ring{transform-origin:50% 30%;animation:ring 2s ease-in-out infinite}
@keyframes ring{0%,40%,100%{transform:rotate(0)}5%,15%,25%{transform:rotate(-16deg)}10%,20%,30%{transform:rotate(16deg)}}
.em-buzz{animation:buzz 2.4s linear infinite}
@keyframes buzz{0%,70%,100%{transform:translateX(0)}74%,82%,90%{transform:translateX(-2px)}78%,86%,94%{transform:translateX(2px)}}
.em-blink{animation:blink 1.8s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
.em-rise{animation:rise 3s ease-in-out infinite}
@keyframes rise{0%,100%{transform:translateY(3px);opacity:.75}50%{transform:translateY(-2px);opacity:1}}
.em-set{animation:set 3s ease-in-out infinite}
@keyframes set{0%,100%{transform:translateY(-2px)}50%{transform:translateY(3px);filter:saturate(1.6)}}
.em-hop{animation:hop 1.4s ease-in-out infinite}
.em-sway{transform-origin:50% 100%;animation:sway 2.6s ease-in-out infinite}
.em-beat{animation:beat 1.3s ease-in-out infinite}
@keyframes beat{0%,40%,100%{transform:scale(1)}15%{transform:scale(1.22)}30%{transform:scale(1.08)}}
.em-bow{transform-origin:50% 100%;animation:bow 2.6s ease-in-out infinite}
@keyframes bow{0%,100%{transform:rotate(0) translateY(0)}50%{transform:rotate(-10deg) translateY(1px)}}
.em-no{animation:no 1.8s ease-in-out infinite}
@keyframes no{0%,50%,100%{transform:rotate(0)}10%,30%{transform:rotate(-12deg)}20%,40%{transform:rotate(12deg)}}
.em-save{animation:save 1.8s ease-in-out infinite}
@keyframes save{0%,100%{transform:translateY(-2px)}50%{transform:translateY(2px) scale(.94)}}
.em-spin{animation:spin 2.4s ease-in-out infinite}
@keyframes spin{0%,50%{transform:rotate(0)}80%,100%{transform:rotate(180deg)}}
.em-trash{transform-origin:20% 100%;animation:trash 2.4s ease-in-out infinite}
@keyframes trash{0%,60%,100%{transform:rotate(0)}70%,85%{transform:rotate(-14deg)}}
.em-flash{animation:flash 2.6s ease-in-out infinite}

<script>
const DOC = "agenda/semana";
const LS = "agenda-visitas-v1";
const DAYN = ["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"];
const DAYS = ["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"];
const WEEK = ["2026-10-19","2026-10-20","2026-10-21","2026-10-22","2026-10-23","2026-10-24","2026-10-25"];
const GROUP = {S:"🌾 Simpatizante",D:"🐑 Dama",C:"🐏 Caballero",A:"🧑 Adolescente",N:"🧒 Niño"};
function etapa(e){e=+e;return e<12?"🧒 Niño":e<18?"🧑 Adolescente":e<30?"🙋 Joven":e<60?"🧔 Adulto":"👴 Adulto mayor"}
let lastPt = {x:innerWidth/2,y:innerHeight/2};
let npOpen = null, assets = null, upBusy = null;
let S = null, db = null, sel = 0, wlFilter = "all", calM = null, caseFilter = "open", probOpen = null, delAsk = null, toastT, saveT, saving = Promise.resolve();
const fired = {}; let audioCtx = null, wake = null;

const $ = (s, r=document) => r.querySelector(s);
const pad = n => String(n).padStart(2,"0");
function todayStr(){const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function nowMin(){const d=new Date();return d.getHours()*60+d.getMinutes()+d.getSeconds()/60}
function hm(m){m=Math.round(m);let h=Math.floor(m/60),mm=m%60;const ap=h>=12?"pm":"am";h=h%12||12;return h+":"+pad(mm)+" "+ap}
function dayLabel(f){const d=new Date(f+"T12:00");return {w:DAYN[d.getDay()],s:DAYS[d.getDay()],n:d.getDate()}}
const MESES=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const TIPOS=["Espiritual","Familiar","Salud","Económico","Trabajo","Otro"];
const TIPO_E={Espiritual:"🙏",Familiar:"👨‍👩‍👧",Salud:"🩺","Económico":"💰",Trabajo:"💼",Otro:"📌"};
const EST_E={"Abierto":"🔴","En seguimiento":"🟡","Resuelto":"🟢"};
const ESTADOS=["Abierto","En seguimiento","Resuelto"];
function fmtF(f){const d=new Date(f+"T12:00");return d.getDate()+" "+MESES[d.getMonth()].slice(0,3)}
function addDays(f,n){const d=new Date(f+"T12:00");d.setDate(d.getDate()+n);return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function weekOf(f){const d=new Date(f+"T12:00");const off=(d.getDay()+6)%7;const mon=addDays(f,-off);return [0,1,2,3,4,5,6].map(i=>addDays(mon,i))}
function ensureDay(f){let i=S.days.findIndex(d=>d.f===f);if(i>=0)return i;S.days.push({f,am:true,pm:true,ids:[]});S.days.sort((a,b)=>a.f<b.f?-1:1);return S.days.findIndex(d=>d.f===f)}
function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function toast(t){const el=$("#toast");el.textContent=t;try{animoji(el)}catch(e){}el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,2600)}

/* ---------- guardado ---------- */
const SHK=["id","n","g","det","nb","tel","edad","civil","foto","cargos","hitos"];
let PRIV=null, lastP={}, lastV={}, lastCfg="", lastPriv="", pendingRender=false;
function isPastor(){return !S||S._role!=="sec"}
function clean(v){return JSON.parse(JSON.stringify(v))}
function sharedOf(p){const o={};for(const k of SHK){const v=p[k];if(v!==undefined&&v!==null&&v!==""&&!(Array.isArray(v)&&!v.length))o[k]=v}return o}
function privOf(){const pv={};for(const p of Object.values(S.people)){const o={};for(const k in p){if(SHK.includes(k))continue;const v=p[k];if(v==null||v===""||v===false||v===0||(k==="e"&&v==="p"))continue;o[k]=v}if(Object.keys(o).length)pv[p.id]=o}
  return {days:S.days,cfg:S.cfg,cases:S.cases||[],pv}}
function save(){
  clearTimeout(saveT); saveT=setTimeout(flush,500);
}
function flush(){
  if(!db||!S) return saving;
  saving=saving.then(async()=>{
    const w=[];
    for(const p of Object.values(S.people)){const j=JSON.stringify(sharedOf(p));if(lastP[p.id]!==j){lastP[p.id]=j;w.push(db.collection("people").doc(p.id).set(JSON.parse(j)))}}
    const ids=new Set((S.serv||[]).map(s=>s.id));
    for(const s of S.serv||[]){const j=JSON.stringify(s);if(lastV[s.id]!==j){lastV[s.id]=j;w.push(db.collection("serv").doc(s.id).set(JSON.parse(j)))}}
    for(const id of Object.keys(lastV)) if(!ids.has(id)){delete lastV[id];w.push(db.collection("serv").doc(id).delete())}
    if(isPastor()){
      const cj=JSON.stringify({pastorFoto:S.pastorFoto||null});if(cj!==lastCfg){lastCfg=cj;w.push(db.doc("config/app").set(JSON.parse(cj)))}
      if(PRIV){const pj=JSON.stringify(privOf());if(pj!==lastPriv){lastPriv=pj;w.push(db.doc(PRIV).set({estado:pj,at:Date.now()}))}}
    }
    await Promise.all(w);
  }).catch(()=>{lastP={};lastV={};lastCfg="";lastPriv="";toast("No se pudo guardar en la nube. Revise la conexión; se intentará de nuevo.")});
  return saving;
}
function markSynced(){lastP={};lastV={};for(const p of Object.values(S.people))lastP[p.id]=JSON.stringify(sharedOf(p));for(const s of S.serv||[])lastV[s.id]=JSON.stringify(s);lastCfg=JSON.stringify({pastorFoto:S.pastorFoto||null});lastPriv=PRIV?JSON.stringify(privOf()):""}
function softRender(){const a=document.activeElement;if(a&&a.matches&&a.matches("input,textarea,select")){pendingRender=true;return}render()}
document.addEventListener("focusout",()=>{if(pendingRender){pendingRender=false;setTimeout(()=>{if(!document.activeElement?.matches?.("input,textarea,select"))render();else pendingRender=true},50)}});

/* ---------- cálculo de horarios ---------- */
function schedule(di){
  const day=S.days[di], dur=S.cfg.dur, tr=S.cfg.tr;
  const blocks=[]; if(!day.off){ if(day.am) blocks.push([540,720]); if(day.pm) blocks.push([900,1080]); }
  const t=todayStr(), isToday=day.f===t, past=day.f<t, now=nowMin();
  let cursor=blocks.length?blocks[0][0]:540, bi=0; const out=[];
  for(const id of day.ids){
    const p=S.people[id]; if(!p) continue;
    if(p.e==="hecha"){out.push({p,start:p.ini,end:p.fin,kind:"done"});cursor=Math.max(cursor,p.fin+tr);continue}
    if(p.e==="encurso"){const end=p.ini+dur+(p.extra||0);out.push({p,start:p.ini,end,kind:"live"});cursor=Math.max(end,isToday?now:0)+tr;continue}
    if(past){out.push({p,kind:"overflow"});continue}
    let s=cursor; if(isToday) s=Math.max(s,now);
    while(bi<blocks.length){ if(s<blocks[bi][0]) s=blocks[bi][0]; if(s+dur<=blocks[bi][1]+0.01) break; bi++; }
    if(bi>=blocks.length){out.push({p,kind:"overflow"});continue}
    out.push({p,start:s,end:s+dur,kind:"plan",block:bi});cursor=s+dur+tr;
  }
  return out;
}

/* ---------- acciones ---------- */
function findDay(id){return S.days.findIndex(d=>d.ids.includes(id))}
function act(id,a,arg){
  const p=S.people[id]; const di=findDay(id);
  if(a==="start"){
    for(const k in S.people){const q=S.people[k]; if(q.e==="encurso"&&k!==id){q.e="hecha";q.fin=nowMin()}}
    if(S.days[di].f!==todayStr()){toast("Solo puede iniciar visitas del día de hoy");return}
    p.e="encurso";p.ini=nowMin();p.extra=0;p.np=null;unlockAudio();toast("Visita iniciada: "+p.n);burst(["🙏","🏠"],4);
  }
  if(a==="end"){p.e="hecha";p.fin=Math.max(nowMin(),(p.ini||0)+1);toast("🐑 Oveja visitada. Agenda reorganizada.");const dd=S.days[di];const all=dd&&dd.ids.every(x=>S.people[x].e==="hecha");burst(all?["😊","🐑","🎉","🙌"]:["🐑","✅","🎉"],all?10:6);if(all)setTimeout(()=>toast("😊 ¡Terminó todas las visitas del día!"),900)}
  if(a==="conf"){p.conf=!p.conf;toast(p.conf?"👍 Visita confirmada":"Confirmación quitada");if(p.conf)burst("👍",4)}
  if(a==="extra"){p.extra=(p.extra||0)+10;delete fired[id+"5"];delete fired[id+"0"];toast("+10 minutos")}
  if(a==="undo"){p.e="p";p.ini=null;p.fin=null;p.extra=0}
  if(a==="noestaba"){p.e="noestaba";p.ini=null;p.fin=null;if(di>=0)S.days[di].ids.splice(S.days[di].ids.indexOf(id),1);p.ne=S.days[di]?.f||"";toast(p.n+" pasó a la lista de espera")}
  if(a==="up"||a==="down"){const ids=S.days[di].ids,i=ids.indexOf(id),j=a==="up"?i-1:i+1;if(j<0||j>=ids.length)return;[ids[i],ids[j]]=[ids[j],ids[i]]}
  if(a==="move"){const to=+arg;if(di>=0)S.days[di].ids.splice(S.days[di].ids.indexOf(id),1);if(p.e!=="hecha"){p.e="p";p.ini=null;p.fin=null}S.days[to].ids.push(id);toast("Pasó al "+dayLabel(S.days[to].f).w)}

const EMO=[["👨‍👩‍👧","hop"],["🚪","door"],["👍","thumb"],["▶️","play"],["✅","pop"],["✔️","pop"],["⏱️","tick"],["⏳","sway"],["📝","write"],["↩️","undo"],["💬","talk"],["📞","ring"],["📱","buzz"],["📵","blink"],["🌅","rise"],["🌇","set"],["🍽️","shake"],["🐑","hop"],["🐏","hop"],["🌾","sway"],["🌿","sway"],["🩹","beat"],["🙏","bow"],["🙅","no"],["🚫","beat"],["💾","save"],["➕","spin"],["🗑️","trash"],["📷","flash"],["📅","flip"],["🗓️","flip"],["✨","twinkle"],["🔔","bell"],["🔴","beat"],["🟡","beat"],["🟢","beat"],["😊","cool"],["⚠️","blink"],["💡","glow"],["🚶","walk"],["☁️","float"],["🌤️","float"],["🙌","raise"],["🎉","party"],["✖️","spin"],["🩺","swing"],["💰","coin"],["💼","shake"],["📌","pin"],["🤝","shake"],["🏠","hop"],["🔍","shake"],["🎂","glow"],["💍","twinkle"],["🖤","beat"],["💔","beat"],["✏️","write"],["🧒","hop"],["🧑","hop"],["🙋","raise"],["🧔","bow"],["👴","bow"],["✋","raise"],["📊","flip"],["📋","flip"],["⚙️","spin"],["🔥","glow"],["🌥️","float"],["🧊","float"],["🔎","shake"],["💧","rise"],["📄","flip"],["🏅","twinkle"],["⭐","twinkle"],["📜","flip"],["🏁","shake"],["🕰️","tick"],["👩‍💼","bow"]];
const EMO_MAP=Object.fromEntries(EMO);
const EMO_RE=new RegExp("("+EMO.map(e=>e[0].replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|")+")","gu");
function animoji(root){
  if(!root||matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode(n){
    const pe=n.parentElement; if(!pe) return NodeFilter.FILTER_REJECT;
    if(pe.closest("select,option,textarea,script,style,.em,.pasture,.lead,.burst")) return NodeFilter.FILTER_REJECT;
    EMO_RE.lastIndex=0; return EMO_RE.test(n.nodeValue)?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT}});
  const nodes=[]; while(w.nextNode()) nodes.push(w.currentNode);
  for(const n of nodes){
    const frag=document.createDocumentFragment();
    for(const part of n.nodeValue.split(EMO_RE)){
      if(!part) continue;
      if(EMO_MAP[part]){const s=document.createElement("span");s.className="em em-"+EMO_MAP[part];s.textContent=part;frag.appendChild(s)}
      else frag.appendChild(document.createTextNode(part));
    }
    n.parentNode.replaceChild(frag,n);
  }
}

  let pres=0,last=null,streak=0,counting=true;

  return {tot,pres,pct:tot?Math.round(pres/tot*100):null,last,streak,perMonth,dots:L.slice(0,8).reverse().map(s=>s.pres.includes(pid))};
}

function calendar(selF){
  if(!calM) calM=selF.slice(0,7);
  const [y,m]=calM.split("-").map(Number); const first=new Date(y,m-1,1); const lead=(first.getDay()+6)%7; const nd=new Date(y,m,0).getDate();
  const t=todayStr(); const segDates=new Set((S.cases||[]).filter(c=>c.seg&&c.estado!=="Resuelto").map(c=>c.seg));
  let g=["L","M","M","J","V","S","D"].map(x=>`<div class="dn">${x}</div>`).join("");
  for(let i=0;i<lead;i++) g+=`<div class="cd out" aria-hidden="true"></div>`;
  for(let n=1;n<=nd;n++){
    const f=y+"-"+pad(m)+"-"+pad(n); const d=S.days.find(x=>x.f===f);
    const tot=d?d.ids.length:0, done=d?d.ids.filter(id=>S.people[id]?.e==="hecha").length:0;
    let mk="", cls="";
    if(d&&d.off){mk="🚫"} else if(tot&&done===tot){mk="😊";cls=" full"} else if(done){mk="✔️"} else if(tot){mk=`<span class="mk dot">${tot}</span>`}
    if(mk&&!mk.startsWith("<span")) mk=`<span class="mk">${mk}</span>`;
    if(!mk) mk=`<span class="mk"></span>`;
    const lbl=`${n} de ${MESES[m-1]}`+(tot?`, ${done} de ${tot} visitas hechas`:"")+(segDates.has(f)?", seguimiento pendiente":"");
    g+=`<button class="cd${cls}${f===t?" today":""}${f===selF?" sel":""}" data-date="${f}" aria-label="${lbl}"><span class="num">${n}</span>${mk}${segDates.has(f)?'<span class="bell">🔔</span>':""}</button>`;
  }
  return `<section class="cal" aria-label="Calendario"><div class="calhead"><button class="btn sm" data-cm="-1" aria-label="Mes anterior">‹</button><h2>📅 ${MESES[m-1]} ${y}</h2><button class="btn sm" data-cm="1" aria-label="Mes siguiente">›</button></div>
    <div class="calgrid">${g}</div>
    <div class="legend"><span><b style="color:var(--blue)">3</b> visitas programadas</span><span>✔️ día comenzado</span><span>😊 todas las visitas hechas</span><span>🔔 seguimiento</span><span>🚫 no disponible</span></div></section>`;
}

    im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error("img"))};im.src=u});
}

      <div class="acts" style="margin-top:8px"><button class="btn gold" data-a="end" data-id="${live.p.id}">✅ Terminé la visita</button><button class="btn sm" data-a="extra" data-id="${live.p.id}">⏱️ +10 min</button><button class="btn sm" id="wake">${wake?"💡 Pantalla encendida":"💡 Mantener pantalla encendida"}</button></div></div></div>`;
  }
  const next=sc.find(x=>x.kind==="plan");
  if(!next) return `<div class="now"><div class="clock"><span class="ico">😊</span></div><div><div class="who">No quedan visitas para hoy</div><div class="hint">Puede traer personas de la lista de espera si le queda tiempo.</div></div></div>`;
  const mins=next.start-nowMin();
  return `<div class="now"><div class="clock"><span class="ico">🚶</span><span id="clock">${mins<=0?"Ya":hm(next.start).replace(/ (am|pm)/,"")}</span></div><div style="min-width:0"><div class="who">Siguiente: ${esc(next.p.n)}</div><div class="hint">${mins<=1?"Le toca ahora.":"En "+Math.round(mins)+" min, a las "+hm(next.start)+"."} Toque “Iniciar” al llegar para que el tiempo cuente.</div>
    <div class="acts" style="margin-top:8px"><button class="btn pri" data-a="start" data-id="${next.p.id}">▶️ Iniciar visita</button></div></div></div>`;
}
function fmtRem(r){const neg=r<0;r=Math.abs(r);const m=Math.floor(r),s=Math.floor((r-m)*60);return (neg?"+":"")+m+":"+pad(s)}
function card(x,isToday){

function sheetClick(b){

    (q.cargos=q.cargos||[]).push({id:"g"+Date.now().toString(36),cargo:c,area:a,desde:$("#cg-d").value||"",hasta:""});save();render();toast("🏅 Cargo agregado");burst(["🏅","⭐"],4);return true}
  if(b.dataset.cgend){const q=S.people[sheetPid];const c=q.cargos.find(x=>x.id===b.dataset.cgend);if(c){c.hasta=todayStr();save();render();toast("🏁 Cargo pasado al historial")}return true}
  if(b.dataset.cgdel){const q=S.people[sheetPid];if(cgDelAsk!==b.dataset.cgdel){cgDelAsk=b.dataset.cgdel;renderSheet();return true}q.cargos=q.cargos.filter(x=>x.id!==cgDelAsk);cgDelAsk=null;save();render();toast("Cargo borrado");return true}
  if(b.id==="htadd"){const q=S.people[sheetPid];const t=$("#ht-t").value.trim();if(!t){toast("Escriba qué pasó");return true}
    (q.hitos=q.hitos||[]).push({id:"h"+Date.now().toString(36),f:$("#ht-f").value||"",t});save();render();toast("⭐ Momento agregado");burst("⭐",4);return true}
  if(b.dataset.htdel){const q=S.people[sheetPid];q.hitos=(q.hitos||[]).filter(x=>x.id!==b.dataset.htdel);save();render();return true}

/* ---------- avisos ---------- */
function unlockAudio(){try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();audioCtx.resume()}catch(e){}}
function beep(times){if(!audioCtx)return;for(let i=0;i<times;i++){const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=880;o.connect(g);g.connect(audioCtx.destination);const t=audioCtx.currentTime+i*0.45;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.3,t+0.03);g.gain.exponentialRampToValueAtTime(0.0001,t+0.35);o.start(t);o.stop(t+0.4)}try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}
function tick(){
  if(!S) return;
  const t=todayStr(), di=S.days.findIndex(d=>d.f===t); if(di<0) return;
  const sc=schedule(di), live=sc.find(x=>x.kind==="live");
  if(live){
    const rem=live.end-nowMin();
    if(rem<=5&&rem>0&&!fired[live.p.id+"5"]){fired[live.p.id+"5"]=1;beep(1);toast("Quedan 5 minutos de visita")}
    if(rem<=0&&!fired[live.p.id+"0"]){fired[live.p.id+"0"]=1;beep(3);toast("Se cumplió el tiempo de la visita")}
    if(sel===di){const c=$("#clock");if(c)c.textContent=fmtRem(rem);const b=$("#livebox");if(b)b.className="now "+(rem<0?"over":"live")}
  }else{
    const next=sc.find(x=>x.kind==="plan");
    if(next){const m=next.start-nowMin();if(m<=10&&m>0&&!fired[next.p.id+"n"]){fired[next.p.id+"n"]=1;beep(1);toast("En 10 min: "+next.p.n)}}
  }
}
setInterval(tick,1000);
setInterval(()=>{if(S&&!document.activeElement?.matches("textarea,select,input"))render()},60000);

/* ---------- eventos ---------- */
function burst(em,n=6){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  for(let i=0;i<n;i++){const s=document.createElement("span");s.className="burst";s.textContent=Array.isArray(em)?em[i%em.length]:em;
    s.style.left=lastPt.x+"px";s.style.top=lastPt.y+"px";s.style.setProperty("--dx",(Math.random()*120-60)+"px");s.style.animationDelay=(i*40)+"ms";
    document.body.appendChild(s);setTimeout(()=>s.remove(),1300)}
}
document.addEventListener("pointerdown",e=>{lastPt={x:e.clientX,y:e.clientY}},true);
document.addEventListener("click",e=>{
  if(e.target.id==="sheet"){closeSheet();return}
  const b=e.target.closest("button"); if(!b||!S) return; unlockAudio();
  if(sheetClick(b)) return;
  if(viewClick(b)) return;
  if(b.dataset.date){sel=ensureDay(b.dataset.date);calM=b.dataset.date.slice(0,7);probOpen=null;if(view!=="agenda"){setView("agenda");return}render();return}
  if(b.dataset.cm){const [y,m]=calM.split("-").map(Number);const d=new Date(y,m-1+(+b.dataset.cm),1);calM=d.getFullYear()+"-"+pad(d.getMonth()+1);render();return}
  if(b.dataset.c){caseAct(b.dataset.c,b);return}
  if(b.dataset.cf){caseFilter=b.dataset.cf;S._csOpen=true;render();return}
  if(b.dataset.a){act(b.dataset.id,b.dataset.a);return}
  if(b.dataset.wf){wlFilter=b.dataset.wf;S._wlOpen=true;render();return}
  if(b.id==="am"||b.id==="pm"||b.id==="off"){S.days[sel][b.id]=!S.days[sel][b.id];if(b.id==="off")toast(S.days[sel].off?"🚫 Día marcado como no disponible":"👍 Día disponible otra vez");save();render();return}
  if(b.id==="fill"){S._wlOpen=true;fillGaps();return}
  if(b.id==="wake"){if(navigator.wakeLock&&!wake){navigator.wakeLock.request("screen").then(w=>{wake=w;w.addEventListener("release",()=>{wake=null});render()}).catch(()=>toast("Este dispositivo no permite mantener la pantalla encendida"))}return}
});

  if(el.id==="offm"){S.days[sel].offm=el.value;save();toast("Motivo guardado")}
  if(el.id==="offmove"&&el.value!==""){const d=S.days[sel];const ids=d.ids.filter(id=>S.people[id].e!=="hecha");
    for(const id of ids){d.ids.splice(d.ids.indexOf(id),1);const q=S.people[id];q.e="p";q.ini=null;q.fin=null;if(el.value!=="wl")S.days[+el.value].ids.push(id)}
    save();render();toast(`${ids.length} visitas movidas`);return}
  if(el.id==="dur"){S.cfg.dur=+el.value;save();render();toast("Agenda recalculada")}
  if(el.id==="tr"){S.cfg.tr=+el.value;save();render();toast("Agenda recalculada")}
  if(el.dataset.move){if(el.value==="wl")act(el.dataset.move,"remove");else if(el.value!=="")act(el.dataset.move,"move",el.value)}
  if(el.dataset.add&&el.value!==""){S._wlOpen=true;act(el.dataset.add,"add",el.value)}
});
document.addEventListener("input",e=>{const el=e.target;if(!S)return;
  if(el.id==="sq"){sheetQ=el.value;const L=$("#qres");if(L){L.innerHTML=qResults();animoji(L)}return}

  const id=el.dataset?.nota;if(id){S.people[id].nota=el.value;save()}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&sheetOpen)closeSheet()});
document.addEventListener("toggle",e=>{if(!S)return;if(e.target.id==="wlp")S._wlOpen=e.target.open;if(e.target.id==="csp")S._csOpen=e.target.open},true);

/* ---------- arranque ---------- */
function migrate(){
  let changed=false;
  for(const f of WEEK){ if(!S.days.some(d=>d.f===f)){ S.days.push({f,am:true,pm:true,ids:[]}); changed=true; } }
  S.days.sort((a,b)=>a.f<b.f?-1:1);
  return changed;
}
function pickDay(){if(!S.days||!S.days.length){sel=0;return}const t=todayStr();const i=S.days.findIndex(d=>d.f===t);const nx=S.days.findIndex(d=>d.f>t&&d.ids.length);sel=i>=0?i:nx>=0?nx:S.days.length-1}
function pickDayOld(){const t=todayStr();const i=S.days.findIndex(d=>d.f===t);sel=i>=0?i:(t>S.days[S.days.length-1].f?S.days.length-1:0)}

function buildS(ps,vs,cf,privJson,role){
  const S2={v:2,people:{},serv:[],days:[],cases:[],cfg:{dur:30,tr:0},_role:role,_wlOpen:S?._wlOpen};
  for(const d of ps.docs) S2.people[d.id]=Object.assign({id:d.id,e:"p",ini:null,fin:null,extra:0,nota:""},clean(d.data()),{id:d.id});
  for(const d of vs.docs) S2.serv.push(Object.assign(clean(d.data()),{id:d.id}));
  if(cf.exists) S2.pastorFoto=cf.data().pastorFoto||null;
  if(privJson){const pj=JSON.parse(privJson);S2.days=pj.days||[];S2.cfg=pj.cfg||S2.cfg;S2.cases=pj.cases||[];for(const [id,o] of Object.entries(pj.pv||{})) if(S2.people[id]) Object.assign(S2.people[id],o)}
  return S2;
}
function subscribe(){
  db.collection("people").limit(1000).onSnapshot(snap=>{let ch=false;
    for(const c of snap.docChanges()){if(c.type==="removed")continue;const id=c.doc.id;const d=clean(c.doc.data());const p=S.people[id]||(S.people[id]={id,e:"p",ini:null,fin:null,extra:0,nota:""});
      const j=JSON.stringify(sharedOf(Object.assign({},d,{id})));if(lastP[id]===j)continue;
      for(const k of SHK)delete p[k];Object.assign(p,d,{id});lastP[id]=JSON.stringify(sharedOf(p));ch=true}
    if(ch)softRender()},()=>{});
  db.collection("serv").limit(1000).onSnapshot(snap=>{let ch=false;
    for(const c of snap.docChanges()){const id=c.doc.id;
      if(c.type==="removed"){if(lastV[id]!==undefined){delete lastV[id];S.serv=S.serv.filter(s=>s.id!==id);ch=true}continue}
      const d=Object.assign(clean(c.doc.data()),{id});const j=JSON.stringify(d);if(lastV[id]===j)continue;
      const i=S.serv.findIndex(s=>s.id===id);if(i>=0)S.serv[i]=d;else S.serv.push(d);lastV[id]=JSON.stringify(d);ch=true}
    if(ch)softRender()},()=>{});
}

/* ---------- importar y copia de seguridad ---------- */
function showImport(){
  $("#tabbar").innerHTML="";
  $("#main").innerHTML=`<section class="block"><div class="bhead"><h2>📥 Pasar sus datos a la app</h2></div>
    <div class="status">La base de datos está vacía. Elija el archivo <b>datos-redil.json</b> que le entregó Claude (guárdelo antes en Archivos) y la app cargará todas las personas, la asistencia y su agenda.</div>
    <label class="btn pri" style="text-align:center">📂 Elegir archivo<input type="file" id="impf" accept=".json,application/json" class="vh"></label>
    <div class="status" id="impst"></div></section>`;
}
document.addEventListener("change",e=>{if(e.target.id==="impf"&&e.target.files&&e.target.files[0])importData(e.target.files[0])},true);
async function importData(file){
  const st=$("#impst");st.textContent="Leyendo archivo…";
  try{
    const data=JSON.parse(await file.text());
    if(!data.people||typeof data.people!=="object") throw new Error("formato");
    const ops=[];
    for(const [id,p] of Object.entries(data.people)) ops.push(["set",db.collection("people").doc(id),Object.assign({},p,{id})]);
    for(const s of data.serv||[]) ops.push(["set",db.collection("serv").doc(s.id),s]);
    ops.push(["set",db.doc("config/app"),{pastorFoto:data.pastorFoto||null}]);
    if(data.priv) ops.push(["set",db.doc(PRIV),{estado:JSON.stringify(data.priv),at:Date.now()}]);
    for(let k=0;k<ops.length;k+=400){const b=db.batch();for(const [,ref,val] of ops.slice(k,k+400))b.set(ref,val);await b.commit();st.textContent=`Guardando… ${Math.min(k+400,ops.length)} de ${ops.length}`}
    st.textContent="✅ Datos cargados.";burst(["🐑","🎉","🙌"],10);
    setTimeout(loadAll,600);
  }catch(e){st.textContent="No se pudo leer ese archivo. Asegúrese de elegir datos-redil.json."}
}
function downloadBackup(){
  const people={};for(const p of Object.values(S.people))people[p.id]=sharedOf(p);
  const data={app:"redil",version:1,fecha:new Date().toISOString(),people,serv:S.serv||[],pastorFoto:S.pastorFoto||null,priv:isPastor()?privOf():null};
  const blob=new Blob([JSON.stringify(data)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="redil-copia-"+todayStr()+".json";document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);toast("💾 Copia descargada");
}
